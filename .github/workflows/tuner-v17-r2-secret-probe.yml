name: TUNER probe R2 credentials for Windows handoff

on:
  push:
    branches: [tuner/v17-windows-builder-bridge]
    paths: [.github/workflows/tuner-v17-r2-secret-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check mappings without revealing values
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          foreach ($name in @('R2_BUCKET','CLOUDFLARE_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Host "missing=$name"
              $missing += $name
            } else {
              Write-Host "present=$name"
            }
          }
          if ($missing.Count -gt 0) { throw "R2 mappings unavailable: $($missing -join ',')" }
          if ($env:R2_BUCKET -ne 'pad-sensei-products') { throw 'Unexpected R2 bucket mapping' }
          Write-Host 'r2_credentials=PASS'
