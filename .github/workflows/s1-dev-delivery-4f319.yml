name: S1 dev delivery and loaded-source proof 4f319

on:
  push:
    branches: [tuner/s1-dev-delivery-4f319-20260913]
    paths: [.github/workflows/s1-dev-delivery-4f319.yml]

concurrency:
  group: 64pe-s1-dev-delivery-4f319
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable accepted product
        uses: actions/checkout@v4
        with:
          ref: 4f3197d24c8a08238a6b191cace30a41cf05519e
          submodules: recursive
          persist-credentials: false

      - name: Assert exact accepted identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4f3197d24c8a08238a6b191cace30a41cf05519e
          test "$(git rev-parse HEAD^{tree})" = 9f492241be3aa2dd4c0bb0c21c9f22243f7847d4
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
          git diff --exit-code
          git diff --cached --exit-code

      - name: Deploy audited product to dev only
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}

  verify-loaded-source:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable accepted product
        uses: actions/checkout@v4
        with:
          ref: 4f3197d24c8a08238a6b191cace30a41cf05519e
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked browser tooling
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4f3197d24c8a08238a6b191cace30a41cf05519e
          test "$(git rev-parse HEAD^{tree})" = 9f492241be3aa2dd4c0bb0c21c9f22243f7847d4
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
          npm ci
          command -v google-chrome

      - name: Verify served bytes, Chrome parsed source, and S1 execution
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require('@playwright/test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const base = 'https://murinaikurashi.com/apps/64-pad-dev/';
          const hash = value => crypto.createHash('sha256').update(value).digest('hex');
          const product = '4f3197d24c8a08238a6b191cace30a41cf05519e';
          const tree = '9f492241be3aa2dd4c0bb0c21c9f22243f7847d4';

          async function runPhase(page, cdp, phase) {
            const response = phase === 'fresh'
              ? await page.goto(base, { waitUntil: 'load', timeout: 60000 })
              : await page.reload({ waitUntil: 'load', timeout: 60000 });
            assert.equal(response.status(), 200, phase + ' document');
            await page.waitForFunction(() => typeof padWebGetPushDisplaySnapshot === 'function' && typeof getDiatonicTetrads === 'function');
            const overlay = page.locator('#audio-start-overlay.active');
            if (await overlay.count()) await overlay.click();
            await page.locator('#audio-start-overlay').waitFor({ state: 'attached' });
            await page.waitForFunction(() => !document.getElementById('audio-start-overlay')?.classList.contains('active'));
            await page.evaluate(() => {
              document.getElementById('midi-device-select').value = 'all';
              if (!window.__s1Input.onmidimessage) initWebMIDI();
              window.__s1Played = [];
              playCurrentChord = () => window.__s1Played.push(getCurrentChordPlaybackMidiNotes());
              AppState.mode = 'chord'; AppState.key = 0; AppState.scaleIdx = 0; AppState.diatonicMode = 'tetrad';
              padWebPushControlState.chordLowerLayerIndex = 0;
              render();
            });
            await page.waitForFunction(() => typeof window.__s1Input.onmidimessage === 'function');
            await page.getByRole('button', { name: 'Push Display', exact: true }).click();
            const send = async cc => page.evaluate(cc => {
              window.__s1Input.onmidimessage({ data: new Uint8Array([0xb0, cc, 127]) });
              window.__s1Input.onmidimessage({ data: new Uint8Array([0xb0, cc, 0]) });
            }, cc);
            await send(21);
            await page.waitForFunction(() => padWebGetPushDisplaySnapshot().chordLowerRow?.labels?.[0] === 'Diatonic');
            assert.deepEqual(await page.evaluate(() => [BuilderState.root, BuilderState.quality.name]), [0, 'Maj7']);
            assert.equal(await page.evaluate(() => window.__s1Played.length), 1);
            const labels = await page.evaluate(() => padWebGetPushDisplaySnapshot().chordLowerRow.labels);
            const expected = await page.evaluate(() => ['Diatonic', ...getDiatonicTetrads(SCALES[0].pcs, 0, 4).map(t => t.chordName)]);
            assert.deepEqual(labels, expected);
            const accent = async () => page.evaluate(() => {
              const ctx = window.__s1Canvas.getContext('2d');
              const data = ctx.getImageData(132, 148, 108, 7).data;
              let n = 0;
              for (let i = 0; i < data.length; i += 4) if (data[i] === 255 && data[i + 1] === 219 && data[i + 2] === 92) n++;
              return n;
            });
            assert.ok((await accent()) > 0, 'selected Chord lower OLED label has no accent pixels');
            await send(20);
            await page.waitForFunction(() => padWebGetPushDisplaySnapshot().chordLowerRow?.labels?.[0] === 'Relative');
            await send(21);
            assert.deepEqual(await page.evaluate(() => [BuilderState.root, BuilderState.quality.name]), [9, 'm7']);
            assert.ok((await accent()) > 0, 'relative selected OLED label has no accent pixels');
            for (let i = 0; i < 4; i++) await send(20);
            assert.equal(await page.evaluate(() => padWebGetPushDisplaySnapshot().chordLowerRow.labels[0]), 'Secondary');
            await send(22);
            assert.deepEqual(await page.evaluate(() => [BuilderState.root, BuilderState._fromSecDom, BuilderState._secDomTargetIsMajor]), [9, true, false]);
            assert.equal(await page.evaluate(() => JSON.parse(localStorage.getItem('64pad-settings')).showParentScales), true);
            await send(20); await send(21);
            assert.deepEqual(await page.evaluate(() => [BuilderState._fromSecDom, BuilderState._fromDiatonic]), [false, true]);
            const metrics = await page.evaluate(() => {
              const r = document.getElementById('pad-grid').getBoundingClientRect();
              return {
                grid: { x: r.x, y: r.y, width: r.width, height: r.height },
                canvas: { width: window.__s1Canvas.width, height: window.__s1Canvas.height },
                frames: window.__s1Frames,
                encodedBytes: window.__s1Frame.length,
                row: padWebGetPushDisplaySnapshot().chordLowerRow,
                sw: null,
              };
            });
            assert.ok(metrics.grid.width > 0 && metrics.grid.height > 0);
            assert.deepEqual(metrics.canvas, { width: 960, height: 160 });
            assert.ok(metrics.frames > 3);
            assert.ok(metrics.encodedBytes > 960 * 160 * 2);
            metrics.sw = await page.evaluate(async () => ({
              controller: navigator.serviceWorker.controller?.scriptURL || null,
              registrations: (await navigator.serviceWorker.getRegistrations()).length,
            }));
            assert.equal(metrics.sw.controller, null);
            assert.equal(metrics.sw.registrations, 0);
            console.log('S1_DEV_EXECUTION=' + JSON.stringify({ phase, product, tree, metrics }));
          }

          (async () => {
            const browser = await chromium.launch({
              executablePath: execFileSync('which', ['google-chrome'], { encoding: 'utf8' }).trim(),
              headless: true,
            });
            try {
              const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
              const identityFiles = ['index.html', 'sw.js', 'push-web-control.js', 'midi.js', 'push-display-webusb-app.js', 'push-midi-cc-map.js'];
              for (const file of identityFiles) {
                const response = await context.request.get(base + file);
                assert.equal(response.status(), 200, file);
                const bytes = await response.body();
                assert.deepEqual(bytes, fs.readFileSync(file), 'Served source mismatch: ' + file);
                const cacheControl = response.headers()['cache-control'] || '';
                if (file === 'push-web-control.js' || file === 'midi.js' || file === 'push-display-webusb-app.js') {
                  assert.ok(/no-store/i.test(cacheControl), file + ' is not no-store on dev');
                }
                console.log('S1_SERVED_IDENTITY=' + JSON.stringify({ file, sha256: hash(bytes), cacheControl }));
              }

              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(String(e)));
              const cdp = await context.newCDPSession(page);
              const parsed = new Map();
              cdp.on('Debugger.scriptParsed', e => { if (e.url) parsed.set(e.scriptId, e.url); });
              await cdp.send('Debugger.enable');

              await page.addInitScript(() => {
                const input = { id: 's1-live', name: 'Ableton Push 3 Live Port', state: 'connected', type: 'input', connection: 'open', open: async () => {}, onmidimessage: null };
                const user = { ...input, id: 's1-user', name: 'Ableton Push 3 User Port' };
                window.__s1Midi = [];
                const output = { id: 's1-out', name: 'Ableton Push 3 Live Port', state: 'connected', type: 'output', connection: 'open', open: async () => {}, send: bytes => window.__s1Midi.push(Array.from(bytes)) };
                const access = { inputs: new Map([[input.id, input], [user.id, user]]), outputs: new Map([[output.id, output]]), sysexEnabled: true, onstatechange: null };
                Object.defineProperty(navigator, 'requestMIDIAccess', { value: async () => access, configurable: true });
                Object.defineProperty(navigator, 'usb', { value: {}, configurable: true });
                window.__s1Input = input;
                const original = HTMLCanvasElement.prototype.getContext;
                HTMLCanvasElement.prototype.getContext = function (...args) {
                  if (this.width === 960 && this.height === 160) window.__s1Canvas = this;
                  return original.apply(this, args);
                };
              });
              await page.route('**/push-display-webusb.js?*', async route => {
                if (new URL(route.request().url()).searchParams.has('s1-live-real')) return route.continue();
                await route.fulfill({ contentType: 'application/javascript', body: `
                  export { WIDTH, HEIGHT, encodePushDisplayFrame } from './push-display-webusb.js?s1-live-real=1';
                  export class PushWebUsbDisplay {
                    constructor(usb, frame, notify) { this.notify = notify; window.__s1Frame = Array.from(frame); window.__s1Frames = 1; notify('idle', 'Test transport'); }
                    setFrame(frame) { window.__s1Frame = Array.from(frame); window.__s1Frames++; }
                    async connect() { this.notify('running', 'Test transport'); }
                    async stop() { this.notify('idle', 'Test transport'); }
                  }
                ` });
              });

              for (const phase of ['fresh', 'reload']) {
                parsed.clear();
                await runPhase(page, cdp, phase);
                for (const file of ['push-web-control.js', 'midi.js', 'push-display-webusb-app.js', 'push-midi-cc-map.js']) {
                  const path = new URL(file, base).pathname;
                  const scripts = [...parsed].filter(([, url]) => { try { return new URL(url).pathname === path; } catch { return false; } });
                  assert.ok(scripts.length > 0, 'Not browser-parsed: ' + file + ' phase=' + phase);
                  for (const [scriptId, url] of scripts) {
                    const source = (await cdp.send('Debugger.getScriptSource', { scriptId })).scriptSource;
                    assert.equal(source, fs.readFileSync(file, 'utf8'), 'Browser loaded different source: ' + url);
                    console.log('S1_PARSED_IDENTITY=' + JSON.stringify({ phase, file, sha256: hash(source) }));
                  }
                }
                assert.deepEqual(errors, []);
              }
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          test "$(git rev-parse HEAD)" = 4f3197d24c8a08238a6b191cace30a41cf05519e
          test "$(git rev-parse HEAD^{tree})" = 9f492241be3aa2dd4c0bb0c21c9f22243f7847d4
          git diff --exit-code
          git diff --cached --exit-code
