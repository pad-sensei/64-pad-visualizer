name: Inspect Web candidate (read only)
on:
  push:
    branches: [codex/web-v180-readonly-repro]
    paths: [.github/workflows/inspect-web-repro.yml]
permissions:
  contents: read
jobs:
  inspect:
    # Public Web tooling, not the DOJO repo-scoped audio runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62bc8f2a92f041a43bb4a5334a2fb69f009ef4d6
          submodules: recursive
          persist-credentials: false
          path: web
      - name: Record source identities and known HTTP limitation
        run: |
          git -C web rev-parse HEAD > source-identities.txt
          git -C web/audio-core rev-parse HEAD >> source-identities.txt
          git -C web/pad-core rev-parse HEAD >> source-identities.txt
          printf '%s\n' 'Dev HTTP reads returned 403 in run 34668775502; no server/client equality is established.' > http-limitation.txt
      - name: Archive public sources for local reproduction
        run: |
          tar --exclude='.git' --exclude='assets' --exclude='img' --exclude='fonts' --exclude='test-results' --exclude='fdtd_output' -czf web-repro.tgz web source-identities.txt http-limitation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exact-web-repro
          path: web-repro.tgz
          retention-days: 1
