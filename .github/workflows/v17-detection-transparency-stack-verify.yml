name: Web v1.7 stacked detection transparency verify

on:
  push:
    branches:
      - agent/v17-detection-transparency-web
    paths:
      - .github/workflows/v17-detection-transparency-stack-verify.yml

permissions:
  contents: write

concurrency:
  group: web-v17-stacked-detection-transparency
  cancel-in-progress: true

jobs:
  verify-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact stacked branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify stack identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "36d545e0e62c2d7e3dad8cac65e489cca3ebd996"
          test "$(git rev-parse HEAD^^{tree})" = "5e74c71608183caf68018d97912f2132a424c2e6"
          test "$(git rev-parse HEAD^:pad-core)" = "a21b9221dded1841542e21ccffb4406fe9c34a13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused stacked regressions
        run: npx vitest run tests/unit/detectChord.test.js tests/unit/v17-detection-transparency-consumer.test.js tests/unit/midi-runtime-bootstrap.test.js

      - name: Run full Web unit suite
        run: npm test

      - name: Verify PWA asset contract
        run: ./tools/sw-assets-check.sh

      - name: Remove validation workflow after PASS
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v17-detection-transparency-stack-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "5e74c71608183caf68018d97912f2132a424c2e6"
          git commit -m "ci: record stacked transparency verification"
          git push origin HEAD:agent/v17-detection-transparency-web
