name: Deploy audited 64-pad-dev bytes to isolated path

on:
  push:
    branches:
      - deploy/v181-sw-human-gate-20260915
    paths:
      - .github/workflows/deploy-dev-isolated.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited product tree carrier
        uses: actions/checkout@v4
        with:
          ref: deploy/v181-sw-human-gate-20260915
          submodules: recursive

      - name: Assert carrier differs from audited product only under .github
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 191231d4b0e4f5136853c2b2ffefdf9de20b7e09
          bad="$(git diff --name-only 191231d4b0e4f5136853c2b2ffefdf9de20b7e09...HEAD | grep -v '^\.github/' || true)"
          if [ -n "$bad" ]; then
            echo "Non-operational carrier delta detected:"
            echo "$bad"
            exit 1
          fi
          test "$(git -C pad-core rev-parse HEAD)" = "65bc1fdd69d9fa50b3150a562be5b907aa288d1a"

      - name: Deploy exact product bytes to isolated path
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-181-isolated/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}

      - name: Verify isolated served bytes and runtime markers
        shell: bash
        run: |
          set -euo pipefail
          base='https://murinaikurashi.com/apps/64-pad-181-isolated/64-pad-dev'
          nonce="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/?probe=${nonce}" -o /tmp/index.html
          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/chord-resolution-ui.js?v=1.8.1-alias-equation8&probe=${nonce}" -o /tmp/helper.js
          cmp index.html /tmp/index.html
          cmp chord-resolution-ui.js /tmp/helper.js
          grep -F "window.__IS_64PAD_DEV_DEPLOY = location.pathname.indexOf('/64-pad-dev/') !== -1;" /tmp/index.html
          grep -F 'padWebGetPrimaryExactAliasEntries' /tmp/helper.js
