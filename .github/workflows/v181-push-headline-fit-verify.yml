name: Verify v1.8.1 no-truncation Push headline

on:
  push:
    branches:
      - codex/v181-tied-alias-equivalence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 80
          persist-credentials: false

      - name: Verify exact checkout and dependency pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C pad-core rev-parse HEAD)" = 4a9b714f728a6f79eb9ec37f18b87bdd49129b9a
          git diff --check 932655e53c52b68def97a501d5d86150eaa7b7d7...HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full unit and PWA regression
        run: |
          set -euo pipefail
          node --check chord-resolution-ui.js
          node --check push-display-webusb-app.js
          node --check push-display-text-fit.js
          npm test
          ./tools/sw-assets-check.sh

      - name: Verify headline semantics and fresh asset identity
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { fitPushPixelText } from './push-display-text-fit.js';
          const app = fs.readFileSync('push-display-webusb-app.js', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const samples = [
            'Eb6 = Cm7 / Eb',
            'Eb7(b9) = Edim7(7) / G · Bb13sus4 / Ab',
            'Eb7(b9) = Edim7(7) / G · Bb13sus4 / Ab = Gm7(b5) / Bb · F13sus4 / Eb',
          ];
          for (const text of samples) {
            const layout = fitPushPixelText(text, 4, 688);
            if (layout.text !== text) throw new Error('headline text was truncated');
            if (!(layout.scale > 0)) throw new Error('invalid headline scale');
            if (layout.width > 688 + 1e-9) throw new Error('headline exceeds available width');
            console.log(JSON.stringify({ text, scale: layout.scale, width: layout.width }));
          }
          const auditedLong = fitPushPixelText(samples[1], 4, 688);
          if (auditedLong.scale < 2) throw new Error('audited long headline should remain readable at scale >= 2');
          if (app.includes("drawPixelText(snap.chord, 32, 42, 4, '#ffdb5c', 20)")) throw new Error('old 20-char cutoff remains');
          if (!app.includes("'=':[0x14,0x14,0x14,0x14,0x14]")) throw new Error('equals glyph missing');
          if (!app.includes("'·':[0x00,0x00,0x08,0x00,0x00]")) throw new Error('neutral separator glyph missing');
          for (const asset of [
            'chord-resolution-ui.js?v=1.8.1-alias-live5',
            'push-display-webusb-app.js?v=webusb-20260914-headline-fit',
            'push-display-text-fit.js?v=20260914-no-truncate',
          ]) {
            if (!index.includes(asset) && asset.includes('push-display-text-fit')) {
              // helper is an ESM dependency of the versioned app, not a direct index tag.
            } else if (!index.includes(asset)) {
              throw new Error(`index missing ${asset}`);
            }
            if (!sw.includes(asset)) throw new Error(`SW missing ${asset}`);
          }
          NODE

      - name: Production dependency audit
        run: |
          set -euo pipefail
          npm audit --omit=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Live browser alias regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/64pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/e2e/v181-alias-runtime.spec.js
          git checkout -- test-results

      - name: Verify read-only tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
