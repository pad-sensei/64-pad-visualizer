name: Verify Standalone gesture parity slice
on:
  push:
    branches: [codex/web-v180-push-human-gate-followup]
    paths: [.github/workflows/apply-push-standalone-parity.yml]
permissions:
  contents: write
concurrency:
  group: web-v180-push-human-gate
  cancel-in-progress: false
jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply hash-checked changes and form exact candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-push-standalone-parity.py
          git rm .github/scripts/apply-push-standalone-parity.py .github/workflows/apply-push-standalone-parity.yml .github/workflows/snapshot-push-parity.yml
          git add push-web-control.js midi.js builder.js instruments.js plain.js index.html sw.js tests/unit/push-web-control.test.js tests/unit/push-web-cc-integration.test.js tests/unit/push-standalone-parity.test.js tests/push-standalone-parity.cjs docs/PUSH_STANDALONE_PARITY_2026-09-12.md tests/unit/push-display-exposure.test.js
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(push): align live browser state and held gestures with Standalone'
          echo "TESTED_CANDIDATE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git show --stat --oneline HEAD
      - name: Install dependencies
        run: npm ci
      - name: Behavioral regressions and syntax
        run: |
          set -euo pipefail
          for f in push-web-control midi builder instruments plain; do node --check "$f.js"; done
          node tests/push-standalone-parity.cjs
          node audio-core/tests/worklet-sustain-bootstrap-smoke.cjs
          npx vitest run tests/unit/push-web-control.test.js tests/unit/push-web-cc-integration.test.js tests/unit/push-standalone-parity.test.js tests/unit/audio-core-sustain-integration.test.js tests/unit/push-midi-cc-map.test.js tests/unit/push-midi-port-contract.test.js tests/unit/push-midi-output-routing.test.js tests/unit/push-display-webusb.test.js tests/unit/push-display-exposure.test.js
      - name: Full Web, PWA, provenance and Pedal/CV negative guards
        run: |
          set -euo pipefail
          npm test
          ./tools/sw-assets-check.sh
          git diff --exit-code
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
          python3 - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path(p).read_text() for p in ['midi.js','push-web-control.js','push-midi-cc-map.js','push-midi-port-contract.js'])
          for forbidden in ['initializePush3PedalMode','0x37, 0x26, 0x50','0x37,0x26,0x50']:
              assert forbidden not in text, forbidden
          print('Pedal/CV negative guard: PASS')
          assert not Path('.github/workflows/apply-push-standalone-parity.yml').exists()
          assert not Path('.github/workflows/snapshot-push-parity.yml').exists()
          assert not Path('.github/scripts/apply-push-standalone-parity.py').exists()
          PY
      - name: Publish verified branch candidate without force
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_CANDIDATE"
          git push origin HEAD:codex/web-v180-push-human-gate-followup
          echo "Exact tested candidate: $TESTED_CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy exact tested candidate to dev only
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md' --exclude='audio-core/tests'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
