name: Fix v1.8.0 Web audit blocker

on:
  push:
    branches:
      - codex/web-v180-push-cc-parity

permissions:
  contents: write

jobs:
  fix-test-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[web-audit-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-cc-parity
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply audited product and test fix
        run: |
          echo ' cHVzaChbJ3BlcmZvcm0nLCB2YWx1ZV0pOwogICAgZ2xvYmFsVGhpcy5zaGlmdE9jdGF2ZSA9IHZhbHVlID0+IGNhbGxzLnB1c2goWydnbG9iYWwnLCB2YWx1ZV0pOwoKICAgIGV4cGVjdChoYW5kbGVMb2dpY2FsKDQ2LCAtMSkpLnRvQmUodHJ1ZSk7CiAgICBleHBlY3QoY2FsbHMpLnRvRXF1YWwoW1snZ2xvYmFsJywgLTFdXSk7CiAgfSk7Cn0pOwoiIiIpCg==' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Verify focused and full Web suite
        run: |
          set -euo pipefail
          npm ci
          npx vitest run tests/unit/push-midi-cc-map.test.js tests/unit/push-web-control.test.js tests/unit/push-web-cc-integration.test.js tests/unit/push-display-webusb.test.js
          npm test
          node --check push-web-control.js
          node --check push-midi-cc-map.js
          node --check midi.js
          ./tools/sw-assets-check.sh
      - name: Deploy exact tested candidate to dev
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
      - name: Commit audited product/test fix
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add push-web-control.js push-midi-cc-map.js midi.js main.js tests/unit/push-web-cc-integration.test.js tests/unit/push-web-control.test.js
          git commit -m 'fix(push): restore Perform octave parity [web-audit-fix]'
          git push origin HEAD:codex/web-v180-push-cc-parity
