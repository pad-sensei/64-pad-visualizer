name: Verify and deploy current WebUSB preview

on:
  push:
    branches:
      - codex/web-push3-webusb-display-preview

permissions:
  contents: read

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-push3-webusb-display-preview
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify product
        run: |
          set -euo pipefail
          npm ci
          node --check push-display-webusb.js
          node --check push-display-webusb-app.js
          node --check push-surface-cleanup.js
          npx vitest run tests/unit/push-display-webusb.test.js tests/unit/push-surface-cleanup.test.js
          npm test
          ./tools/sw-assets-check.sh
      - name: Deploy preview to 64-pad-dev
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
