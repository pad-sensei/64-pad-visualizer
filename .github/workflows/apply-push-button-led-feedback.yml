name: Apply Push button LED feedback

on:
  push:
    branches:
      - codex/web-v180-push-cc-parity

permissions:
  contents: write

concurrency:
  group: web-v180-push-button-led-feedback
  cancel-in-progress: false

jobs:
  apply-test-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[button-led-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-cc-parity
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply product patch
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-push-button-led-feedback.py

      - name: Verify
        run: |
          set -euo pipefail
          npm ci
          node --check push-web-control.js
          node --check midi.js
          npx vitest run \
            tests/unit/push-midi-output-routing.test.js \
            tests/unit/push-web-control.test.js \
            tests/unit/push-web-cc-integration.test.js \
            tests/unit/push-midi-port-contract.test.js \
            tests/unit/push-display-webusb.test.js \
            tests/unit/v180-web-contract.test.js
          npm test
          ./tools/sw-assets-check.sh
          git diff --check

      - name: Deploy exact tested candidate
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}

      - name: Commit tested product changes
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git rm .github/workflows/apply-push-button-led-feedback.yml .github/scripts/apply-push-button-led-feedback.py
          git add \
            push-web-control.js \
            midi.js \
            index.html \
            sw.js \
            tests/unit/push-midi-output-routing.test.js \
            tests/unit/push-web-control.test.js
          git commit -m 'feat(push): mirror active control LEDs on Web [button-led-applied]'
          git push origin HEAD:codex/web-v180-push-cc-parity
