name: Deploy Push WebUSB Preview

on:
  push:
    branches:
      - codex/web-push3-webusb-display-preview

permissions:
  contents: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: codex/web-push3-webusb-display-preview
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire opt-in WebUSB preview into Web app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          tag = '<script type="module" src="push-display-webusb-app.mjs"></script>'
          if tag not in s:
              anchor = '<script src="main.js?v=6.7.52"></script>'
              if anchor not in s:
                  raise SystemExit('main.js script anchor not found')
              s = s.replace(anchor, anchor + '\n' + tag, 1)
          p.write_text(s)

          p = Path('sw.js')
          s = p.read_text()
          entries = "  'push-display-webusb.mjs',\n  'push-display-webusb-app.mjs',\n"
          if "'push-display-webusb.mjs'" not in s:
              anchor = "  'midi.js?v=6.7.52',\n"
              if anchor not in s:
                  raise SystemExit('sw.js MIDI asset anchor not found')
              s = s.replace(anchor, anchor + entries, 1)
          p.write_text(s)
          PY
          git diff --check
          ./tools/sw-assets-check.sh

      - name: Unit verification
        run: |
          npm ci
          npx vitest run tests/unit/push-display-webusb.test.js
          npm test

      - name: Commit product wiring and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add index.html sw.js push-display-webusb.mjs push-display-webusb-app.mjs tests/unit/push-display-webusb.test.js
          git rm .github/workflows/deploy-webusb-preview.yml
          git commit -m 'feat(push): add opt-in WebUSB display preview'
          git push origin HEAD:codex/web-push3-webusb-display-preview

      - name: Deploy preview to 64-pad-dev
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
