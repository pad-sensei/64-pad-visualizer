name: Apply Push 2 / Push 3 Web parity

on:
  push:
    branches:
      - codex/web-v180-push-cc-parity

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[push23-web]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-cc-parity
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Align Web copy/cache/runtime naming for Push 2 and Push 3
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s and new not in s:
                  raise SystemExit(f'anchor missing in {path}: {old}')
              p.write_text(s.replace(old, new, 1))

          replace_one('push-display-webusb-app.js',
                      "from './push-display-webusb.js?v=webusb-20260911-7';",
                      "from './push-display-webusb.js?v=webusb-20260911-9';")
          replace_one('push-display-webusb-app.js',
                      "button.title = 'Connect Push 3 display via WebUSB (Chrome)';",
                      "button.title = 'Connect Push 2 / Push 3 display via WebUSB (Chrome)';")

          replace_one('index.html',
                      '<script type="module" src="push-display-webusb-app.js?v=webusb-20260911-8"></script>',
                      '<script type="module" src="push-display-webusb-app.js?v=webusb-20260911-9"></script>')

          p = Path('sw.js')
          s = p.read_text()
          import re
          s = re.sub(r"var CACHE_NAME = '[^']+';", "var CACHE_NAME = '64pad-v180-preview-20260911-push23-1';", s, count=1)
          s = s.replace("'push-display-webusb.js?v=webusb-20260911-7'", "'push-display-webusb.js?v=webusb-20260911-9'")
          s = s.replace("'push-display-webusb-app.js?v=webusb-20260911-8'", "'push-display-webusb-app.js?v=webusb-20260911-9'")
          p.write_text(s)

          p = Path('midi.js')
          s = p.read_text()
          s = s.replace('let _isPush = false;         // true when Push 3 User Mode detected',
                        'let _isPush = false;         // true when a supported Push 2 / Push 3 MIDI port is detected')
          s = s.replace('var _lastOctCC = 0; // debounce: Push 3 multi-port duplicate CC',
                        'var _lastOctCC = 0; // debounce mirrored/repeated Push octave CC')
          s = s.replace('// LED control: Push 3 User Mode (no SysEx needed) + Launchpad (disabled until physical testing)',
                        '// LED control: Push 2 / Push 3 MIDI output (no SysEx needed) + Launchpad (disabled until physical testing)')
          s = s.replace('Push 3 の光っているパッドから色を選びます。', 'Push の光っているパッドから色を選びます。')
          p.write_text(s)

          p = Path('tests/unit/push-midi-cc-map.test.js')
          s = p.read_text()
          anchor = "      expect(codes(58, 127, { inputName: 'Ableton Push 3 Live Port' })).toEqual([[1, 0]]);\n"
          extra = anchor + "      expect(codes(58, 127, { inputName: 'Ableton Push 2 Live Port' })).toEqual([[1, 0]]);\n"
          if anchor not in s and extra not in s:
              raise SystemExit('Push MIDI generation parity test anchor missing')
          s = s.replace(anchor, extra, 1)
          p.write_text(s)

          p = Path('tests/unit/push-web-cc-integration.test.js')
          s = p.read_text()
          insert_anchor = "            it('keeps Web MIDI LED/CC standard and retires query-string hps gates', () => {\n"
          test = "            it('keeps Push detection generation-neutral for Push 2 and Push 3 MIDI names', () => {\n              expect(midi).toContain('function padWebIsPushMidiPortName(name)');\n              expect(midi).toContain('return /push/i.test(n)');\n              expect(midi).toContain('supported Push 2 / Push 3 MIDI port');\n            });\n\n"
          if test not in s:
              if insert_anchor not in s:
                  raise SystemExit('integration test insertion anchor missing')
              s = s.replace(insert_anchor, test + insert_anchor, 1)
          p.write_text(s)
          PY
      - name: Verify Push 2 / Push 3 focused and full Web suite
        run: |
          set -euo pipefail
          npm ci
          npx vitest run tests/unit/push-display-webusb.test.js tests/unit/push-midi-cc-map.test.js tests/unit/push-web-cc-integration.test.js
          npm test
          node --check push-display-webusb-app.js
          node --check midi.js
          grep -F "productId: PUSH2_PRODUCT_ID" push-display-webusb.js
          grep -F "productId: PUSH3_PRODUCT_ID" push-display-webusb.js
          grep -F "push-display-webusb.js?v=webusb-20260911-9" sw.js
          grep -F "push-display-webusb-app.js?v=webusb-20260911-9" index.html
      - name: Commit model parity changes
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add push-display-webusb-app.js index.html sw.js midi.js tests/unit/push-midi-cc-map.test.js tests/unit/push-web-cc-integration.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(push): complete Push 2 and Push 3 Web parity [push23-web]'
          git push origin HEAD:codex/web-v180-push-cc-parity
