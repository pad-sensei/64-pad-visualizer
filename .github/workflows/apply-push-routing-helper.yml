name: Apply Push routing helper

on:
  push:
    branches:
      - codex/web-push3-webusb-display-preview

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[all-push-ports]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-push3-webusb-display-preview
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch
        run: python3 tools/apply_push_all_output_routing.py
      - name: Verify
        run: |
          npm ci
          node --check midi.js
          node --check push-display-webusb-app.js
          npx vitest run tests/unit/push-midi-output-routing.test.js tests/unit/push-led-shutdown-guard.test.js tests/unit/push-surface-cleanup.test.js tests/unit/push-display-webusb.test.js
          npm test
          ./tools/sw-assets-check.sh
      - name: Commit
        run: |
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add midi.js index.html sw.js push-display-webusb-app.js
          git commit -m 'fix(push): mirror standalone all-output LED routing [all-push-ports]'
          git push origin HEAD:codex/web-push3-webusb-display-preview
