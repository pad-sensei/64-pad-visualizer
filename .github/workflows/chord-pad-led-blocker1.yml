name: Chord pad LED blocker1 repair
on:
  push:
    branches: [tuner/chord-pad-led-blocker1-20260913]
    paths:
      - .github/workflows/chord-pad-led-blocker1.yml
      - .github/chord-pad-led-blocker1.py
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bdf463e939414c416e2ff3c8b5256e443bf249e2
          path: product
          submodules: recursive
          fetch-depth: 2
      - name: Admission
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bdf463e939414c416e2ff3c8b5256e443bf249e2
          test "$(git rev-parse HEAD^)" = 52aa8091434ed205eb5b34b7e6cc00d9e2db30e4
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
          test "$(git ls-remote origin refs/heads/codex/web-v180-push-human-gate-followup | cut -f1)" = bdf463e939414c416e2ff3c8b5256e443bf249e2
          test -z "$(git ls-remote origin refs/heads/tuner/chord-pad-led-blocker1-candidate-20260913)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Dependencies
        working-directory: product
        run: npm ci
      - name: Fail-first on audited blocker
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx vitest run tests/unit/push-chord-pad-led.test.js -t 'one-position without a resolved shape' --reporter=verbose > "$RUNNER_TEMP/fail-first.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/fail-first.log"
          test "$rc" -ne 0
          grep -F 'expected' "$RUNNER_TEMP/fail-first.log" >/dev/null
          git diff --exit-code
      - name: Apply exact Standalone fallback repair
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          python3 ../control/.github/chord-pad-led-blocker1.py "$PWD"
          git diff --check
          git add midi.js
          test "$(git diff --cached --name-only)" = midi.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(push): keep scale background when Chord shape is unresolved'
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git show --stat --oneline HEAD
      - name: Focused and complete regression
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node --check midi.js
          npx vitest run tests/unit/push-chord-pad-led.test.js --reporter=verbose
          node tests/push-standalone-parity.cjs
          node audio-core/tests/worklet-sustain-bootstrap-smoke.cjs
          npm test
          ./tools/sw-assets-check.sh
      - name: Final identity and publish verified candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse HEAD^)" = bdf463e939414c416e2ff3c8b5256e443bf249e2
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git ls-remote origin refs/heads/codex/web-v180-push-human-gate-followup | cut -f1)" = bdf463e939414c416e2ff3c8b5256e443bf249e2
          git push origin HEAD:refs/heads/tuner/chord-pad-led-blocker1-candidate-20260913
          echo "BLOCKER1_CANDIDATE $PRODUCT_HEAD $PRODUCT_TREE"
