name: Apply v1.8.1 readable chord labels

on:
  push:
    branches: [codex/v181-readable-chord-labels]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-readable-chord-labels
          submodules: recursive
          fetch-depth: 80
      - name: Apply shared display formatter
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64, re
          helper = Path('chord-resolution-ui.js')
          text = helper.read_text()
          formatter = base64.b64decode('').decode()
          dom = base64.b64decode('').decode()
          if 'function padWebFormatChordDisplayName(name)' not in text:
              text = text.replace("  function padWebCandidateIsFullExact(candidate) {\n", formatter + "  function padWebCandidateIsFullExact(candidate) {\n", 1)
          old = ".map(function(entry) { return entry.candidate && entry.candidate.name || ''; })"
          new = ".map(function(entry) {\n        var name = entry.candidate && entry.candidate.name || '';\n        return padWebFormatChordDisplayName(name);\n      })"
          text = text.replace(old, new, 2)
          if 'function padWebApplyCandidateDisplayNames(root, candidates)' not in text:
              text = text.replace("  // Keep resolver order and original candidate indexes. This decorator only\n", dom + "  // Keep resolver order and original candidate indexes. This decorator only\n", 1)
          text = text.replace("  function padWebDecorateAliasEquation(root, candidates) {\n    if (typeof document === 'undefined' || !root) return;\n    var presentation = padWebGetResolvedPresentation(candidates);", "  function padWebDecorateAliasEquation(root, candidates) {\n    if (typeof document === 'undefined' || !root) return;\n    padWebApplyCandidateDisplayNames(root, candidates);\n    var presentation = padWebGetResolvedPresentation(candidates);", 1)
          text = text.replace("  global.padWebGetTopResolvedCandidates = padWebGetTopResolvedCandidates;\n", "  global.padWebFormatChordDisplayName = padWebFormatChordDisplayName;\n  global.padWebGetTopResolvedCandidates = padWebGetTopResolvedCandidates;\n", 1)
          text = text.replace("  if (typeof module !== 'undefined') module.exports = {\n", "  if (typeof module !== 'undefined') module.exports = {\n    padWebFormatChordDisplayName: padWebFormatChordDisplayName,\n", 1)
          helper.write_text(text)
          unit = Path('tests/unit/v181-chord-resolution-consumer.test.js')
          u = unit.read_text()
          block = base64.b64decode('').decode()
          if "normalizes stacked chord modifiers for readability" not in u:
              u = u.replace("describe('v1.8.1 chord-resolution consumer', () => {\n", "describe('v1.8.1 chord-resolution consumer', () => {\n" + block, 1)
          unit.write_text(u)
          e2e = Path('tests/e2e/v181-alias-runtime.spec.js')
          e = e2e.read_text()
          block2 = base64.b64decode('').decode()
          if "normalizes a stacked modifier label in the live Web presentation" not in e:
              marker = "  test('draws a shrinking scale-2 equation with integer pixel cells in Chromium'"
              e = e.replace(marker, block2 + marker, 1)
          e2e.write_text(e)
          old_asset = 'chord-resolution-ui.js?v=1.8.1-alias-live5'
          new_asset = 'chord-resolution-ui.js?v=1.8.1-readable-labels6'
          for p in [Path('index.html'), Path('sw.js'), unit]:
              s = p.read_text().replace(old_asset, new_asset)
              p.write_text(s)
          sw = Path('sw.js'); s = sw.read_text(); m = re.search(r"var CACHE_NAME = '([^']+)';", s)
          if not m: raise SystemExit('cache name missing')
          old_cache = m.group(1); new_cache = '64pad-v181-preview-20260915-readable-labels-9'
          sw.write_text(s.replace(old_cache, new_cache, 1))
          for p in Path('tests/unit').glob('*.test.js'):
              s = p.read_text()
              if old_cache in s: p.write_text(s.replace(old_cache, new_cache))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify unit and PWA contracts
        run: |
          set -euo pipefail
          node --check chord-resolution-ui.js
          npm test
          ./tools/sw-assets-check.sh
          npm audit --omit=dev
          git diff --check
          grep -q "chord-resolution-ui.js?v=1.8.1-readable-labels6" index.html
          grep -q "chord-resolution-ui.js?v=1.8.1-readable-labels6" sw.js
          grep -q "64pad-v181-preview-20260915-readable-labels-9" sw.js
      - name: Browser regression
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 >/tmp/64pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/e2e/v181-alias-runtime.spec.js
          git checkout -- test-results
      - name: Commit verified product changes
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add chord-resolution-ui.js index.html sw.js tests/unit tests/e2e/v181-alias-runtime.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(v1.8.1): normalize chord label readability'
          git push origin HEAD:codex/v181-readable-chord-labels
