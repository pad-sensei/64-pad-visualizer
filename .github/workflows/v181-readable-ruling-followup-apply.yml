name: Apply v1.8.1 readable omit follow-up

on:
  push:
    branches: [codex/v181-readable-chord-labels]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-readable-chord-labels
          submodules: recursive
          fetch-depth: 80

      - name: Apply Human ruling follow-up
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          helper = Path('chord-resolution-ui.js')
          text = helper.read_text()
          old = """    var display = base;\n    if (modifiers.length > 0) display += '(' + modifiers.join(',') + ')';\n    if (omits.length > 0) display += omits.join('');\n    return display + slashSuffix;\n"""
          new = """    // Human ruling 2026-09-15: an omit-only label keeps its parenthesis\n    // as the visual boundary (e.g. C7(omit3)); omit moves outside only when\n    // another alteration/tension group already provides that boundary.\n    if (modifiers.length === 0 && omits.length > 0) return source;\n\n    var display = base;\n    if (modifiers.length > 0) display += '(' + modifiers.join(',') + ')';\n    if (omits.length > 0) display += omits.join('');\n    return display + slashSuffix;\n"""
          if old not in text:
              if new not in text:
                  raise SystemExit('formatter follow-up anchor missing')
          else:
              text = text.replace(old, new, 1)
          helper.write_text(text)

          unit = Path('tests/unit/v181-chord-resolution-consumer.test.js')
          u = unit.read_text()
          u = u.replace("expect(ui.padWebFormatChordDisplayName('C7(omit3)')).toBe('C7omit3');", "expect(ui.padWebFormatChordDisplayName('C7(omit3)')).toBe('C7(omit3)');")
          anchor = "    expect(ui.padWebFormatChordDisplayName('Em7(b5)')).toBe('Em7(b5)');\n"
          extra = "    expect(ui.padWebFormatChordDisplayName('Dm6(omit5)')).toBe('Dm6(omit5)');\n    expect(ui.padWebFormatChordDisplayName('Ab7sus4(omit5)')).toBe('Ab7sus4(omit5)');\n"
          if extra not in u:
              if anchor not in u:
                  raise SystemExit('unit omit-only anchor missing')
              u = u.replace(anchor, anchor + extra, 1)
          unit.write_text(u)

          e2e = Path('tests/e2e/v181-alias-runtime.spec.js')
          e = e2e.read_text()
          if "keeps omit-only labels parenthesized in Web and Push" not in e:
              marker = "  test('draws a shrinking scale-2 equation with integer pixel cells in Chromium'"
              idx = e.find(marker)
              if idx < 0:
                  raise SystemExit('e2e insertion marker missing')
              block = r'''  test('keeps omit-only labels parenthesized in Web and Push', async ({ page }) => {
    await page.goto('./?silent=1&e2e=v181-readable-omit');
    await page.waitForLoadState('domcontentloaded');

    const result = await page.evaluate(() => {
      const root = document.getElementById('midi-detect');
      root.innerHTML = '<div class="detect-top-group"><span class="detect-candidate-best" data-candidate-idx="0">C7(omit3)</span></div>';
      const candidates = [{ name: 'C7(omit3)', isTopRanked: true, resolutionCompleteness: 'exact', resolutionScore: 100 }];
      padWebDecorateAliasEquation(root, candidates);
      return {
        text: root.querySelector('[data-candidate-idx="0"]').textContent,
        raw: candidates[0].name,
        pushText: padWebFormatTopResolvedChordText(candidates),
      };
    });

    expect(result.text).toBe('C7(omit3)');
    expect(result.pushText).toBe('C7(omit3)');
    expect(result.raw).toBe('C7(omit3)');
  });

'''
              e = e[:idx] + block + e[idx:]
          e2e.write_text(e)

          old_asset = 'chord-resolution-ui.js?v=1.8.1-readable-labels6'
          new_asset = 'chord-resolution-ui.js?v=1.8.1-readable-labels7'
          for p in [Path('index.html'), Path('sw.js'), Path('tests/unit/v181-chord-resolution-consumer.test.js')]:
              data = p.read_text()
              if old_asset in data:
                  data = data.replace(old_asset, new_asset)
              elif new_asset not in data:
                  raise SystemExit(f'{p}: chord helper identity missing')
              p.write_text(data)

          old_cache = '64pad-v181-preview-20260915-readable-labels-9'
          new_cache = '64pad-v181-preview-20260915-readable-labels-10'
          sw = Path('sw.js')
          data = sw.read_text()
          if old_cache in data:
              data = data.replace(old_cache, new_cache, 1)
          elif new_cache not in data:
              raise SystemExit('SW cache identity missing')
          sw.write_text(data)
          for p in Path('tests/unit').glob('*.test.js'):
              data = p.read_text()
              if old_cache in data:
                  p.write_text(data.replace(old_cache, new_cache))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify unit and PWA contracts
        run: |
          set -euo pipefail
          node --check chord-resolution-ui.js
          npm test
          ./tools/sw-assets-check.sh
          npm audit --omit=dev
          git diff --check
          grep -q "chord-resolution-ui.js?v=1.8.1-readable-labels7" index.html
          grep -q "chord-resolution-ui.js?v=1.8.1-readable-labels7" sw.js
          grep -q "64pad-v181-preview-20260915-readable-labels-10" sw.js
          test ! -e .github/workflows/v181-app-asset-id-apply.yml

      - name: Browser regression
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 >/tmp/64pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/e2e/v181-alias-runtime.spec.js
          git checkout -- test-results

      - name: Commit verified product changes
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add chord-resolution-ui.js index.html sw.js tests/unit tests/e2e/v181-alias-runtime.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(v1.8.1): preserve omit-only readability boundary'
          git push origin HEAD:codex/v181-readable-chord-labels
