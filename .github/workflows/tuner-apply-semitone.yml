name: TUNER apply semitone parity

on:
  push:
    branches:
      - tuner/64pe-semitone-fix-20260912
    paths:
      - .github/workflows/tuner-apply-semitone.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout control helper
        uses: actions/checkout@v4
        with:
          ref: tuner/64pe-semitone-fix-20260912
          path: control
          persist-credentials: false

      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          ref: 2fa84f39d92ed4f5070fe525411c21b2978d3326
          path: product
          submodules: recursive
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Verify exact baseline and install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "2fa84f39d92ed4f5070fe525411c21b2978d3326"
          test "$(git -C product rev-parse HEAD^{tree})" = "ededffba9d2b84c4005aa72f0cfc7ebe10fb3867"
          test -z "$(git -C product status --porcelain)"
          test "$(git -C product ls-remote origin refs/heads/codex/web-v180-push-human-gate-followup | cut -f1)" = "2fa84f39d92ed4f5070fe525411c21b2978d3326"
          cd product
          npm ci
          npx vitest run tests/unit/push-web-control.test.js

      - name: Prove old source fails new parity regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/tuner_apply_semitone_fix.py product tests
          set +e
          (cd product && npx vitest run tests/unit/push-web-control.test.js) > "$RUNNER_TEMP/negative.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/negative.log"
          test "$rc" -ne 0
          echo NEGATIVE_CONTROL_PASS

      - name: Apply bounded correction and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/tuner_apply_semitone_fix.py product source
          node --check product/push-web-control.js
          git -C product diff --check
          test "$(git -C product diff --name-only | sort | paste -sd, -)" = "push-web-control.js,sw.js,tests/unit/push-display-exposure.test.js,tests/unit/push-web-control.test.js"
          test -z "$(git -C product diff -- midi.js host-adapter.js audio-core/)"
          cd product
          npx vitest run tests/unit/push-web-control.test.js tests/unit/push-midi-cc-map.test.js tests/unit/push-web-cc-integration.test.js tests/unit/push-display-exposure.test.js
          npm test
          node audio-core/tests/worklet-bootstrap-smoke.js
          git diff --check

      - name: Commit and fast-forward the product branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product ls-remote origin refs/heads/codex/web-v180-push-human-gate-followup | cut -f1)" = "2fa84f39d92ed4f5070fe525411c21b2978d3326"
          git -C product config user.name "ChatGPT TUNER"
          git -C product config user.email "noreply@openai.com"
          git -C product add push-web-control.js sw.js tests/unit/push-web-control.test.js tests/unit/push-display-exposure.test.js
          git -C product commit -m "fix(push): preserve chord state on semitone nudge"
          new_head="$(git -C product rev-parse HEAD)"
          git -C product push origin HEAD:codex/web-v180-push-human-gate-followup
          echo "NEW_PRODUCT_HEAD=$new_head"
          test -z "$(git -C product status --porcelain)"
