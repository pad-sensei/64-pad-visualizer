name: TUNER dispatch semitone verify

on:
  push:
    branches:
      - tuner/64pe-semitone-fix-20260912
    paths:
      - .github/workflows/tuner-apply-semitone.yml

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: f4605772d88311df63164c7880e1ce87aa5e4d2b
      TARGET_REF: codex/web-v180-push-human-gate-followup
    steps:
      - name: Assert current PR head
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pad-sensei/64-pad-visualizer/pulls/22 | jq -e --arg sha "$EXPECTED_HEAD" --arg ref "$TARGET_REF" '.state == "open" and .draft == true and .head.sha == $sha and .head.ref == $ref' >/dev/null
          current="$(gh api repos/pad-sensei/64-pad-visualizer/git/ref/heads/$TARGET_REF | jq -r .object.sha)"
          test "$current" = "$EXPECTED_HEAD"

      - name: Dispatch existing exact-head verifier once
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api 'repos/pad-sensei/64-pad-visualizer/actions/workflows/verify-push-parity.yml/runs?event=workflow_dispatch&per_page=20')"
          existing="$(jq -r --arg sha "$EXPECTED_HEAD" '[.workflow_runs[] | select(.head_sha == $sha)][0].id // empty' <<<"$runs")"
          if [[ -z "$existing" ]]; then
            gh api --method POST repos/pad-sensei/64-pad-visualizer/actions/workflows/verify-push-parity.yml/dispatches -f ref="$TARGET_REF" >/dev/null
          fi
          run_id="$existing"
          for _ in $(seq 1 20); do
            if [[ -z "$run_id" ]]; then
              runs="$(gh api 'repos/pad-sensei/64-pad-visualizer/actions/workflows/verify-push-parity.yml/runs?event=workflow_dispatch&per_page=20')"
              run_id="$(jq -r --arg sha "$EXPECTED_HEAD" '[.workflow_runs[] | select(.head_sha == $sha)][0].id // empty' <<<"$runs")"
            fi
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "EXACT_HEAD_VERIFY_RUN=$run_id"
          for _ in $(seq 1 60); do
            payload="$(gh api repos/pad-sensei/64-pad-visualizer/actions/runs/$run_id)"
            status="$(jq -r .status <<<"$payload")"
            if [[ "$status" == completed ]]; then
              jq -e --arg sha "$EXPECTED_HEAD" '.head_sha == $sha and .conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/verify-push-parity.yml"' <<<"$payload" >/dev/null
              echo EXACT_HEAD_VERIFY_PASS
              exit 0
            fi
            sleep 2
          done
          echo 'Exact-head verifier did not complete inside bounded dispatcher window' >&2
          exit 1
