name: Fix WebUSB preview module delivery

on:
  push:
    branches:
      - codex/web-push3-webusb-display-preview

permissions:
  contents: write

jobs:
  fix-test-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[webusb-js-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-push3-webusb-display-preview
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use .js module filenames served by existing Xserver config
        run: |
          set -euo pipefail
          mv push-display-webusb.mjs push-display-webusb.js
          mv push-display-webusb-app.mjs push-display-webusb-app.js
          sed -i "s#'./push-display-webusb.mjs'#'./push-display-webusb.js'#" push-display-webusb-app.js
          sed -i 's#push-display-webusb-app\.mjs#push-display-webusb-app.js#g' index.html
          sed -i 's#push-display-webusb-app\.mjs#push-display-webusb-app.js#g; s#push-display-webusb\.mjs#push-display-webusb.js#g' sw.js
          sed -i "s#../../push-display-webusb.mjs#../../push-display-webusb.js#" tests/unit/push-display-webusb.test.js
          grep -n 'push-display-webusb-app.js' index.html
          grep -n 'push-display-webusb.*js' sw.js
          git diff --check
      - name: Verify Web app
        run: |
          npm ci
          npx vitest run tests/unit/push-display-webusb.test.js
          npm test
          ./tools/sw-assets-check.sh
      - name: Commit product fix and remove temporary workflow
        run: |
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          rm .github/workflows/fix-webusb-js-preview.yml
          git add -A
          git commit -m 'fix(push): serve WebUSB preview as js modules [webusb-js-fixed]'
          git push origin HEAD:codex/web-push3-webusb-display-preview
      - name: Deploy corrected preview to 64-pad-dev
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
