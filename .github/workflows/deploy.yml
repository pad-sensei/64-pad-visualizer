name: Deploy to Xserver

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Identify the redirect configuration
        id: redirect
        run: sha256sum .htaccess | cut -d ' ' -f1 | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"

      - name: Deploy legacy redirect
        uses: burnett01/rsync-deployments@6.0.0
        with:
          # The instrument now ships from pad-sensei/web. Only install the old
          # entrypoint redirect. Abort if the server has custom Apache rules.
          switches: >-
            -avz --checksum
            --rsync-path="(cd ~/murinaikurashi.com/public_html/apps/64-pad &&
            (test ! -e .htaccess || echo '452c5f9d6605d336a413b5f6245300631be9deed22a9501caeec37fb9353558d  .htaccess' | sha256sum --check --status ||
            echo '${{ steps.redirect.outputs.sha }}  .htaccess' | sha256sum --check --status)) && rsync"
          path: .htaccess
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}

  trigger-desktop:
    # Web/Push v1.8.1 ships before Desktop. Keep this job explicit for the
    # later Desktop release, but never dispatch it from a Web main push.
    if: ${{ false }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Desktop build
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DESKTOP_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/pad-sensei/64-pad-explorer-desktop/dispatches \
            -d '{"event_type":"web-updated"}'
