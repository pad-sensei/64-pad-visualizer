name: S1 exact commit completion
on:
  push:
    branches: [tuner/s1-chord-lower-20260912]
    paths: [.github/workflows/s1-finalize.yml]
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90032b93d795b8f70056e3ae850bfea6a487b688
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3a880c172214972b3143cfff5b59ddad94b33abc
          path: product
          submodules: recursive
          fetch-depth: 2
      - name: Restore the exact previously tested product commit, not a new candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3a880c172214972b3143cfff5b59ddad94b33abc
          test "$(git rev-parse HEAD^{tree})" = e8e8e19f45839387ec0b9fbef7f0741092a60ff4
          test "$(git ls-remote origin refs/heads/codex/web-v180-push-human-gate-followup | cut -f1)" = 3a880c172214972b3143cfff5b59ddad94b33abc
          test -z "$(git ls-remote origin refs/heads/tuner/s1-chord-lower-candidate-20260912)"
          python3 - <<'PY'
          from pathlib import Path
          for name in ['s1-lower.test.js','s1-lower.spec.js']:
              p=Path('../control/.github')/name;s=p.read_text()
              assert s.count("'maj7'")==1
              p.write_text(s.replace("'maj7'","'Maj7'"))
          p=Path('../control/.github/s1-lower.spec.js');s=p.read_text()
          old='PUSH_DISPLAY_WIDTH, PUSH_DISPLAY_HEIGHT, encodePushDisplayFrame'
          assert s.count(old)==1
          p.write_text(s.replace(old,'WIDTH, HEIGHT, encodePushDisplayFrame'))
          PY
          python3 ../control/.github/s1-implement.py "$PWD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/unit/push-display-exposure.test.js');s=p.read_text()
          assert s.count('push-display-webusb-app.js?v=webusb-20260912-11')==2
          s=s.replace('push-display-webusb-app.js?v=webusb-20260912-11','push-display-webusb-app.js?v=webusb-20260912-s1')
          old='    // This preview uses the SW cache generation, not a new product version or\n    // per-file query, as its update identity. Install fetches fresh asset bytes.'
          assert old in s
          p.write_text(s.replace(old,'    // S1 changes both the SW generation and the affected asset identities.\n    // Install fetches fresh asset bytes; this is not loaded-browser evidence.'))
          p=Path('tests/unit/push-web-cc-integration.test.js');s=p.read_text()
          for asset,count in [('push-web-control.js',3),('midi.js',1)]:
              old=asset+'?v=1.8.0-parity2';assert s.count(old)==count
              s=s.replace(old,asset+'?v=1.8.0-chord-lower-s1')
          p.write_text(s)
          PY
          git diff --check
          git add push-web-control.js midi.js push-display-webusb-app.js index.html sw.js tests/unit tests/e2e/push-chord-lower.spec.js docs/PUSH_CHORD_LOWER_S1.md
          tree=$(git write-tree)
          test "$tree" = 9f492241be3aa2dd4c0bb0c21c9f22243f7847d4
          test -z "$(git diff --cached --name-only -- .github pad-core audio-core)"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='1789220945 +0000'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          commit=$(printf 'fix(push): connect Chord lower layer selection, labels and LEDs\n' | git commit-tree "$tree" -p 3a880c172214972b3143cfff5b59ddad94b33abc)
          test "$commit" = 4f3197d24c8a08238a6b191cace30a41cf05519e
          git checkout --detach "$commit"
          git diff --exit-code
          git diff --cached --exit-code
          git show --format=fuller --stat HEAD
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Dependencies
        working-directory: product
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Complete browser and clean-source proof with output outside the repository
        working-directory: product
        shell: bash
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/s1-html
        run: |
          set -euo pipefail
          python3 _nocache_server.py 8080 > "$RUNNER_TEMP/s1-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ >/dev/null && break || sleep 1; done
          npx playwright test tests/e2e/push-chord-lower.spec.js --project=chromium --workers=1 --retries=0 --reporter=line --output="$RUNNER_TEMP/s1-results" | tee "$RUNNER_TEMP/s1-browser.log"
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = 4f3197d24c8a08238a6b191cace30a41cf05519e
          test "$(git rev-parse HEAD^{tree})" = 9f492241be3aa2dd4c0bb0c21c9f22243f7847d4
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
          python3 - <<'PY'
          import os,base64,re,hashlib
          from pathlib import Path
          output=Path(os.environ['RUNNER_TEMP'])/'s1-images';output.mkdir()
          text=(Path(os.environ['RUNNER_TEMP'])/'s1-browser.log').read_text()
          pngs=re.findall(r'S1_OLED_PNG ([A-Za-z0-9-]+) ([A-Za-z0-9+/=]+)',text)
          assert len(pngs)==2
          for name,b64 in pngs:
              raw=base64.b64decode(b64,validate=True)
              assert raw.startswith(b'\x89PNG\r\n\x1a\n')
              (output/(name+'.png')).write_bytes(raw)
              print('S1_IMAGE_SHA256',name,hashlib.sha256(raw).hexdigest())
          PY
      - name: Publish only the exact validated candidate ref
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/web-v180-push-human-gate-followup | cut -f1)" = 3a880c172214972b3143cfff5b59ddad94b33abc
          test -z "$(git ls-remote origin refs/heads/tuner/s1-chord-lower-candidate-20260912)"
          git push origin 4f3197d24c8a08238a6b191cace30a41cf05519e:refs/heads/tuner/s1-chord-lower-candidate-20260912
          test "$(git ls-remote origin refs/heads/tuner/s1-chord-lower-candidate-20260912 | cut -f1)" = 4f3197d24c8a08238a6b191cace30a41cf05519e
          git diff --exit-code
          git diff --cached --exit-code
          echo 'S1_PUBLISHED 4f3197d24c8a08238a6b191cace30a41cf05519e 9f492241be3aa2dd4c0bb0c21c9f22243f7847d4'
      - name: Retain the two OLED images separately from test acceptance
        uses: actions/upload-artifact@v4
        with:
          name: s1-oled-4f3197d2
          path: ${{ runner.temp }}/s1-images/*.png
          if-no-files-found: error
          retention-days: 7
