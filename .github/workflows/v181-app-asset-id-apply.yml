name: Apply v1.8.1 Push app asset identity

on:
  push:
    branches:
      - codex/v181-tied-alias-equivalence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-tied-alias-equivalence
          submodules: recursive
          fetch-depth: 80

      - name: Apply asset identity closure
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          old_app = 'push-display-webusb-app.js?v=webusb-20260914-headline-fit'
          new_app = 'push-display-webusb-app.js?v=webusb-20260915-readable-wrap'
          old_cache = "64pad-v181-preview-20260914-alias-equivalence-6"
          new_cache = "64pad-v181-preview-20260915-alias-equivalence-7"

          def replace_exact(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, got {count}')
              if count == 0:
                  if new in text:
                      return
                  raise SystemExit(f'{path}: neither old nor new identity found')
              p.write_text(text.replace(old, new))

          replace_exact('index.html', old_app, new_app, 1)
          replace_exact('sw.js', old_app, new_app, 1)
          replace_exact('sw.js', old_cache, new_cache, 1)
          replace_exact('tests/unit/push-display-exposure.test.js', old_app, new_app, 2)
          replace_exact('tests/unit/push-display-exposure.test.js', old_cache, new_cache, 1)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify unit and PWA contracts
        run: |
          set -euo pipefail
          npm test
          ./tools/sw-assets-check.sh
          git diff --check
          ! grep -R "push-display-webusb-app.js?v=webusb-20260914-headline-fit" index.html sw.js tests/unit/push-display-exposure.test.js
          grep -q "push-display-webusb-app.js?v=webusb-20260915-readable-wrap" index.html
          grep -q "push-display-webusb-app.js?v=webusb-20260915-readable-wrap" sw.js
          grep -q "64pad-v181-preview-20260915-alias-equivalence-7" sw.js

      - name: Browser regression
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 >/tmp/64pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/e2e/v181-alias-runtime.spec.js
          git checkout -- test-results

      - name: Commit verified closure
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No asset identity patch to commit.'
            exit 0
          fi
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add index.html sw.js tests/unit/push-display-exposure.test.js
          git commit -m 'fix(cache): refresh Push display app asset identity'
          git push origin HEAD:codex/v181-tied-alias-equivalence
