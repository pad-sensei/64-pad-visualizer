name: Build A04 Root Quality label repair

on:
  push:
    branches:
      - tuner/a04-root-quality-label-fix-20260913

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tuner/a04-root-quality-label-fix-20260913
          fetch-depth: 2
          submodules: false
      - name: Preserve transformer and switch to exact accepted A04b head
        shell: bash
        run: |
          set -euo pipefail
          cp .github/a04-root-quality-label-fix.py /tmp/a04-root-quality-label-fix.py
          git fetch --depth 2 origin 5a47def365058421316a4f7d9d6cb36e50542e33
          git checkout --detach 5a47def365058421316a4f7d9d6cb36e50542e33
          git submodule update --init --recursive --depth 2
          test "$(git rev-parse HEAD)" = 5a47def365058421316a4f7d9d6cb36e50542e33
          test "$(git rev-parse HEAD^{tree})" = c0f9de5d888cbd39f78028ab55b517f72dbfb245
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply bounded display-label fix
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/a04-root-quality-label-fix.py
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort | tee /tmp/files.txt
          test "$(tr '\n' ' ' < /tmp/files.txt)" = 'index.html push-display-webusb-app.js sw.js tests/unit/push-display-exposure.test.js tests/unit/push-web-cc-integration.test.js '
      - name: Verify label repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check push-display-webusb-app.js
          npx vitest run tests/unit/push-display-exposure.test.js tests/unit/push-chord-entry-display.test.js tests/unit/push-web-cc-integration.test.js tests/unit/push-display-state-sync.test.js
          node tests/push-standalone-parity.cjs
          npm test
          ./tools/sw-assets-check.sh
          grep -F "['Root', 'Tasty', 'Stock', 'Guitar', 'Quality', 'Tension', 'Key', 'Scale']" push-display-webusb-app.js >/dev/null
          grep -F 'push-display-webusb-app.js?v=webusb-20260913-a04c' index.html >/dev/null
          grep -F "64pad-v180-preview-20260913-entry-a04c" sw.js >/dev/null
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
      - name: Commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git add index.html push-display-webusb-app.js sw.js tests/unit/push-display-exposure.test.js tests/unit/push-web-cc-integration.test.js
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'index.html push-display-webusb-app.js sw.js tests/unit/push-display-exposure.test.js tests/unit/push-web-cc-integration.test.js '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(push): show Root and Quality on Chord screen'
          git diff --exit-code
          git diff --cached --exit-code
          echo "A04_LABEL_REPAIR $(git rev-parse HEAD) $(git rev-parse HEAD^{tree})"
          git push origin HEAD:refs/heads/tuner/a04-root-quality-label-candidate-20260913
