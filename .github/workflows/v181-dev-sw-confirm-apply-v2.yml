name: Apply and verify v1.8.1 dev SW audit follow-up v2

on:
  push:
    branches:
      - codex/v181-altered-dominant-ust
    paths:
      - .github/workflows/v181-dev-sw-confirm-apply-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-altered-dominant-ust
          submodules: recursive
          fetch-depth: 100
      - name: Apply audit CONFIRM repair
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify
        run: |
          set -euo pipefail
          npm test
          ./tools/sw-assets-check.sh
          npm audit --omit=dev
          git diff --check
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 >/tmp/64pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          npx playwright test tests/e2e/v181-alias-runtime.spec.js tests/e2e/v181-altered-dominant-ust.spec.js --reporter=line
          git checkout -- test-results
          git diff --check
      - name: Commit verified product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/unit/v181-dev-sw-escape-contract.test.js tests/unit/v180-web-contract.test.js
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix(v1.8.1): fail closed when dev SW escape is exhausted"
          git push origin HEAD:codex/v181-altered-dominant-ust
