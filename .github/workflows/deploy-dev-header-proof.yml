name: Deploy final Push Display header to dev with proof
on:
  push:
    branches:
      - tuner/deploy-dev-header-20260913
permissions:
  contents: read
jobs:
  deploy-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tuner/deploy-dev-header-20260913
          fetch-depth: 2
          submodules: false
      - name: Switch to exact product head
        run: |
          set -euo pipefail
          git fetch --depth 2 origin ad611ad22a390df8995619baac7a0e1533b55317
          git checkout --detach ad611ad22a390df8995619baac7a0e1533b55317
          test "$(git rev-parse HEAD)" = ad611ad22a390df8995619baac7a0e1533b55317
          test "$(git rev-parse HEAD^{tree})" = d382bffbd1b8591084e6c7d7efa0628615aa0602
      - name: Deploy exact head
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
      - name: Prove served bytes
        run: |
          set -euo pipefail
          base='https://murinaikurashi.com/apps/64-pad-dev'
          for f in index.html sw.js push-display-webusb-app.js; do
            curl -fsS -H 'Cache-Control: no-cache' "$base/$f?proof=ad611ad2" -o "/tmp/$f"
            test "$(sha256sum "$f" | awk '{print $1}')" = "$(sha256sum "/tmp/$f" | awk '{print $1}')"
          done
          grep -F 'push-display-webusb-app.js?v=webusb-20260913-header' /tmp/index.html >/dev/null
          grep -F "64pad-v180-preview-20260913-header" /tmp/sw.js >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove Chrome loaded exact header placement
        run: |
          cat > prove.mjs <<'JS'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const name='push-display-webusb-app.js';
          const want=createHash('sha256').update(readFileSync(name)).digest('hex');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[]; let seen=null;
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('response',async r=>{
            const n=new URL(r.url()).pathname.split('/').pop();
            if(n===name) seen={url:r.url(),sha:createHash('sha256').update(await r.body()).digest('hex')};
          });
          await page.goto('https://murinaikurashi.com/apps/64-pad-dev/?proof=ad611ad2',{waitUntil:'networkidle'});
          await page.waitForTimeout(800);
          if(!seen||seen.sha!==want) throw new Error('display module mismatch');
          const rt=await page.evaluate(()=>{
            const button=document.getElementById('push-webusb-display-btn');
            const tutorial=document.getElementById('tut-btn');
            const header=document.querySelector('.header-bar');
            const sound=document.getElementById('sound-header');
            const status=document.getElementById('push-webusb-display-status');
            if(!button||!tutorial||!header||!status) return {missing:true};
            const r=button.getBoundingClientRect();
            return {
              missing:false,
              buttonParent:button.parentElement===header,
              beforeTutorial:button.compareDocumentPosition(tutorial) & Node.DOCUMENT_POSITION_FOLLOWING ? true : false,
              audioContains:!!sound?.contains(button),
              visible:r.width>0&&r.height>0,
              buttonText:button.textContent,
              statusLive:status.getAttribute('aria-live'),
              statusWidth:status.getBoundingClientRect().width,
            };
          });
          console.log('HEADER_RUNTIME',JSON.stringify(rt));
          console.log('PAGE_ERRORS',JSON.stringify(errors));
          if(rt.missing||!rt.buttonParent||!rt.beforeTutorial||rt.audioContains||!rt.visible||rt.buttonText!=='Push Display'||rt.statusLive!=='polite'||errors.length) throw new Error('header placement proof failed');
          await browser.close();
          console.log('CHROME_HEADER_PLACEMENT_PROOF PASS');
          JS
          node prove.mjs
          rm prove.mjs
