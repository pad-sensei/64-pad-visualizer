name: Snapshot exact Web parity sources
on:
  push:
    branches: [codex/web-v180-push-human-gate-followup]
    paths: [.github/workflows/snapshot-push-parity.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
          path: web
      - name: Archive public Web source only
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='assets' --exclude='img' --exclude='fonts' --exclude='node_modules' -czf push-parity-sources.tgz web
          git -C web rev-parse HEAD
          git -C web/audio-core rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: push-parity-sources
          path: push-parity-sources.tgz
          retention-days: 1
