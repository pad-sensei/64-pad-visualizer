name: Dispatch unchanged 64PE dev candidate 2fa84f39

on:
  push:
    branches: [tuner/64pe-dispatch-dev-2fa-20260912]
    paths: [.github/workflows/dispatch-existing-dev-2fa.yml]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: 64pe-dev-dispatch-2fa84f39
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'pad-sensei/64-pad-visualizer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: pad-sensei/64-pad-visualizer
      TARGET_REF: codex/web-v180-push-human-gate-followup
      EXPECTED_HEAD: 2fa84f39d92ed4f5070fe525411c21b2978d3326
      EXPECTED_WORKFLOW_BLOB: 7f7b89a34cd3d3e045980974c976a65af3a377f4
    steps:
      - name: Assert current candidate and completed machine gate
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/22" | jq -e --arg sha "$EXPECTED_HEAD" --arg ref "$TARGET_REF" '.state == "open" and .head.sha == $sha and .head.ref == $ref' >/dev/null
          gh api "repos/$REPO/actions/runs/34672550005" | jq -e --arg sha "$EXPECTED_HEAD" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' >/dev/null
          blob="$(gh api "repos/$REPO/contents/.github/workflows/deploy-dev.yml?ref=$EXPECTED_HEAD" --jq .sha)"
          test "$blob" = "$EXPECTED_WORKFLOW_BLOB"
          gh api "repos/$REPO/actions/workflows/deploy-dev.yml" | jq -e '.state == "active" and .path == ".github/workflows/deploy-dev.yml"' >/dev/null
          printf 'ACCEPTED_HEAD=%s\nEXISTING_DEV_WORKFLOW_BLOB=%s\n' "$EXPECTED_HEAD" "$blob"
      - name: Dispatch existing workflow once and verify returned identity
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$REPO/actions/workflows/deploy-dev.yml/runs?head_sha=$EXPECTED_HEAD&event=workflow_dispatch&per_page=10" --jq '.workflow_runs[0].id // empty')"
          if [[ -n "$existing" ]]; then
            echo "EXISTING_DEV_RUN=$existing; no duplicate dispatch"
            exit 0
          fi
          current="$(gh api "repos/$REPO/git/ref/heads/$TARGET_REF" --jq .object.sha)"
          test "$current" = "$EXPECTED_HEAD"
          response="$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$REPO/actions/workflows/deploy-dev.yml/dispatches" -f ref="$TARGET_REF")"
          run_id="$(printf '%s' "$response" | jq -r '.workflow_run_id // empty')"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo 'Dispatch response did not contain a run ID. Inspect Actions; do not repeat dispatch.' >&2
            exit 1
          fi
          echo "DISPATCHED_DEV_RUN=$run_id"
          if ! gh api "repos/$REPO/actions/runs/$run_id" | jq -e --arg sha "$EXPECTED_HEAD" '.head_sha == $sha and .event == "workflow_dispatch" and .path == ".github/workflows/deploy-dev.yml"' >/dev/null; then
            gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" || true
            echo 'Unexpected or unreadable dispatched identity; cancellation requested.' >&2
            exit 1
          fi
          printf 'DISPATCH_VERIFIED_HEAD=%s\n' "$EXPECTED_HEAD"
          echo 'The existing dev workflow is now responsible for its tests and dev-only rsync.'
          echo 'Dispatch success is not deployment success or browser/hardware acceptance.'
