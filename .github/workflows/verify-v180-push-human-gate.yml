name: Verify v1.8 Push Human Gate candidate

on:
  push:
    branches:
      - codex/web-v180-push-human-gate-followup

permissions:
  contents: read

concurrency:
  group: web-v180-push-human-gate
  cancel-in-progress: false

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-human-gate-followup
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused Push + sustain verification
        run: |
          set -euo pipefail
          node --check push-web-control.js
          node --check push-midi-cc-map.js
          node --check push-midi-port-contract.js
          node --check midi.js
          node --check audio-core/epiano-worklet-engine.js
          node audio-core/tests/worklet-sustain-bootstrap-smoke.cjs
          npx vitest run \
            tests/unit/audio-core-sustain-integration.test.js \
            tests/unit/push-web-control.test.js \
            tests/unit/push-midi-cc-map.test.js \
            tests/unit/push-web-cc-integration.test.js \
            tests/unit/push-midi-port-contract.test.js \
            tests/unit/push-midi-output-routing.test.js \
            tests/unit/push-display-webusb.test.js \
            tests/unit/v180-web-contract.test.js

      - name: Pedal/CV negative guard
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'midi.js',
            'push-midi-cc-map.js',
            'push-midi-port-contract.js',
            'push-web-control.js',
          ];
          const source = files.map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          const forbidden = [
            'initializePush3PedalMode',
            '0x37, 0x26, 0x50',
            '0x37,0x26,0x50',
          ];
          for (const needle of forbidden) {
            if (source.includes(needle)) {
              throw new Error(`forbidden automatic Pedal/CV SysEx path detected: ${needle}`);
            }
          }
          console.log('Pedal/CV negative guard: PASS');
          NODE

      - name: Full Web and PWA verification
        run: |
          set -euo pipefail
          npm test
          ./tools/sw-assets-check.sh
          git diff --check
          test "$(git submodule status audio-core | awk '{print $1}' | tr -d '+-U')" = "60d36a0ace35681f770bdd122b645b0f196f796d"

      - name: Deploy exact tested candidate
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md' --exclude='audio-core/tests'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
