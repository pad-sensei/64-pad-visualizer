name: v1.8.1 chord resolution verify

on:
  push:
    branches:
      - codex/web-v181-chord-resolution

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify exact dependency
        env:
          TARGET_PAD_CORE: 4a9b714f728a6f79eb9ec37f18b87bdd49129b9a
        run: |
          set -euo pipefail
          test "$(git -C pad-core rev-parse HEAD)" = "$TARGET_PAD_CORE"
      - name: Verify focused chord-resolution consumer
        run: npx vitest run tests/unit/v181-chord-resolution-consumer.test.js tests/unit/detectChord.test.js
      - name: Verify full Web suite
        run: npm test
      - name: Verify diff cleanliness
        run: git diff --check ad611ad22a390df8995619baac7a0e1533b55317 HEAD
      - name: Verify PWA and version identities
        run: |
          set -euo pipefail
          grep -q '"softwareVersion":"1.8.1"' index.html
          grep -q 'v1.8.1</span>' index.html
          grep -q '64pad-v181-preview-20260914-chord-resolution-2' sw.js
          for asset in \
            'pad-core/chord-resolver.js?v=1.8.1-resolution2' \
            'chord-resolution-ui.js?v=1.8.1-resolution2' \
            'plain.js?v=1.8.1-resolution2' \
            'midi.js?v=1.8.1-resolution2'; do
            grep -q "$asset" index.html
            grep -q "$asset" sw.js
          done
      - name: Assert verification is read-only
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain=v1 | test ! -s /dev/stdin
