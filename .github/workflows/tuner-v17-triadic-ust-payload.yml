name: TUNER v1.7 triadic UST canonical payload repair

on:
  push:
    branches:
      - agent/preserve-input-canonical-payload-lifetime
    paths:
      - .github/workflows/tuner-v17-triadic-ust-payload.yml

permissions:
  contents: write

concurrency:
  group: tuner-v17-triadic-ust-payload
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: [self-hosted, macOS, ARM64, dojo-audio]
    timeout-minutes: 30
    steps:
      - name: Checkout Web PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/preserve-input-canonical-payload-lifetime
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Apply triadic canonical payload repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once('observed-ust-consumer.js',
          '''    kind: layer.kind || null,
              name: layer.name || null,
              degrees: Array.isArray(layer.degrees) ? layer.degrees.slice() : [],''',
          '''    kind: layer.kind || null,
              name: layer.name || null,
              base: layer.base || null,
              degrees: Array.isArray(layer.degrees) ? layer.degrees.slice() : [],''')

          consumer = Path('observed-ust-consumer.js')
          text = consumer.read_text()
          marker = '''// Canonical bridge for Web and Desktop Push. This is deliberately plain data:
          // naming, localisation, HTML, and platform-specific labels are consumers' work.
          '''
          helper = r'''// Convert the existing Web/pad-core authored triadic UST text into the
          // canonical bridge shape. This is serialization only: C++ never re-analyses theory,
          // and a legacy Q label is deliberately rejected because physical quartal geometry
          // remains authoritative in padAnalyzeObservedShellUst().
          function padWebParseLegacyTriadicUstLayer(legacyText) {
            if (typeof legacyText !== 'string') return null;
            var body = legacyText.replace(/^UST:\s*/, '').trim();
            var slash = body.lastIndexOf(' / ');
            if (slash <= 0 || slash >= body.length - 3) return null;
            var upper = body.slice(0, slash).trim();
            var base = body.slice(slash + 3).trim();
            if (!upper || !base || /^Q(?:[b#]?\d|\b)/.test(upper)) return null;
            var degrees = [];
            var match = upper.match(/^(.*?)\s*\[([^\]]*)\]\s*$/);
            if (match) {
              upper = match[1].trim();
              degrees = match[2].split(',').map(function(value) { return value.trim(); }).filter(Boolean);
            }
            if (!upper || upper.length > 32 || base.length > 96 || degrees.length > 8
                || degrees.some(function(value) { return value.length > 16; })) return null;
            return {
              kind: 'triad',
              name: upper,
              base: base,
              degrees: degrees,
              confidence: 'register',
              positionConfidence: 'none',
              notes: [],
            };
          }

          '''
          if marker not in text or 'function padWebParseLegacyTriadicUstLayer' in text:
              raise SystemExit('observed consumer triadic helper insertion boundary changed')
          text = text.replace(marker, helper + marker, 1)
          consumer.write_text(text)

          replace_once('observed-ust-consumer.js',
          '''  var analysis = padAnalyzeObservedShellUst({
              chord: {
                rootPC: Number(chord.rootPC),
                quality: chord.quality,
                name: chord.name || null,
              },
              notes: notes,
            });

            return {''',
          '''  var analysis = padAnalyzeObservedShellUst({
              chord: {
                rootPC: Number(chord.rootPC),
                quality: chord.quality,
                name: chord.name || null,
              },
              notes: notes,
            });
            var observedUst = padWebObservedPayloadLayer(analysis.ust);
            if (!observedUst && typeof formatDetectedUstText === 'function') {
              observedUst = padWebParseLegacyTriadicUstLayer(formatDetectedUstText(
                notes.map(function(note) { return note.midi; }), Number(chord.rootPC), chord.name || ''
              ));
            }
            if (observedUst && !observedUst.base) observedUst.base = chord.name || null;

            return {''')

          replace_once('observed-ust-consumer.js',
          '''    shell: padWebObservedPayloadLayer(analysis.shell),
              ust: padWebObservedPayloadLayer(analysis.ust),''',
          '''    shell: padWebObservedPayloadLayer(analysis.shell),
              ust: observedUst,''')

          replace_once('observed-ust-consumer.js',
          '''  if (!payload || !payload.available) return formatFraction(legacyText || '');
            if (!payload.ust || payload.ust.kind !== 'quartal') {
              // Physical evidence may reject a legacy quartal subset, but never suppress a
              // separate legacy triadic interpretation.
              if (payload.shell && payload.shell.positionConfidence !== 'none' && /^UST:\s*Q/.test(legacyText || '')) return '';
              return formatFraction(legacyText || '');
            }
            var baseQuality = payload.chord && payload.chord.quality;
            var chordName = payload.chord && payload.chord.name || '';
            var rootName = typeof chordRootDisplayName === 'function' ? chordRootDisplayName(chordName) : '';
            var suffix = typeof detectedUstBaseQualitySuffix === 'function'
              ? detectedUstBaseQualitySuffix(baseQuality) : baseQuality;
            var baseName = rootName ? rootName + suffix : chordName;''',
          '''  if (!payload || !payload.available) return formatFraction(legacyText || '');
            if (!payload.ust) {
              // Physical evidence may reject a legacy quartal subset, but never suppress a
              // separate legacy triadic interpretation.
              if (payload.shell && payload.shell.positionConfidence !== 'none' && /^UST:\s*Q/.test(legacyText || '')) return '';
              return formatFraction(legacyText || '');
            }
            if (payload.ust.kind !== 'quartal' && payload.ust.kind !== 'triad') return formatFraction(legacyText || '');
            var baseQuality = payload.chord && payload.chord.quality;
            var chordName = payload.chord && payload.chord.name || '';
            var rootName = typeof chordRootDisplayName === 'function' ? chordRootDisplayName(chordName) : '';
            var suffix = typeof detectedUstBaseQualitySuffix === 'function'
              ? detectedUstBaseQualitySuffix(baseQuality) : baseQuality;
            var baseName = payload.ust.base || (rootName ? rootName + suffix : chordName);''')

          replace_once('observed-ust-consumer.js',
          '''  window.padWebNormalizeObservedSources = padWebNormalizeObservedSources;
            window.padBuildObservedShellUstPayload = padBuildObservedShellUstPayload;''',
          '''  window.padWebNormalizeObservedSources = padWebNormalizeObservedSources;
            window.padWebParseLegacyTriadicUstLayer = padWebParseLegacyTriadicUstLayer;
            window.padBuildObservedShellUstPayload = padBuildObservedShellUstPayload;''')

          replace_once('observed-ust-consumer.js',
          '''  padWebNormalizeObservedSources,
            padWebEscapeHtml,''',
          '''  padWebNormalizeObservedSources,
            padWebParseLegacyTriadicUstLayer,
            padWebEscapeHtml,''')

          replace_once('tests/unit/observed-ust-consumer.test.js',
          '''  padWebNormalizeObservedSources,
            padBuildObservedShellUstPayload,''',
          '''  padWebNormalizeObservedSources,
            padWebParseLegacyTriadicUstLayer,
            padBuildObservedShellUstPayload,''')

          tests = Path('tests/unit/observed-ust-consumer.test.js')
          text = tests.read_text()
          insertion = r'''
            it('serializes an authored ordinary triadic UST into the canonical payload', () => {
              const payload = withLegacyFormatter({
                formatDetectedUstText: () => 'UST: D△ (II) [9,#11,13] / C7',
                detectedUstBaseQuality: () => '7',
              }, () => padBuildObservedShellUstPayload({
                chord: { rootPC: 0, quality: '7', name: 'C7' },
                midiNotes: [48, 52, 58, 62, 66, 69],
              }));
              expect(payload.ust).toEqual({
                kind: 'triad', name: 'D△ (II)', base: 'C7', degrees: ['9', '#11', '13'],
                confidence: 'register', positionConfidence: 'none', notes: [],
              });
              expect(padWebFormatObservedUstInlineFromPayload(payload)).toContain('D△ (II) [9,#11,13] / C7');
            });

            it('never promotes a legacy quartal guess into the canonical bridge', () => {
              expect(padWebParseLegacyTriadicUstLayer('UST: Q1 [1,11,b7] / Cm7')).toBeNull();
              expect(padWebParseLegacyTriadicUstLayer('UST: Dm (II) [9,11,13] / Cm7')).toMatchObject({
                kind: 'triad', name: 'Dm (II)', base: 'Cm7', degrees: ['9', '11', '13'],
              });
            });

            it('keeps physical Q4 authoritative even when triadic legacy text also exists', () => {
              const payload = withLegacyFormatter({
                formatDetectedUstText: () => 'UST: Dm (II) [9,11,13] / Cm7',
              }, () => padBuildObservedShellUstPayload({
                chord: { rootPC: 0, quality: 'm7', name: 'Cm7' }, sourceNotes: canonicalCm7Q4(),
              }));
              expect(payload.ust).toMatchObject({ kind: 'quartal', name: 'Q4', base: 'Cm7' });
            });
          '''
          closing = '\n});\n'
          pos = text.rfind(closing)
          if pos < 0 or 'serializes an authored ordinary triadic UST' in text:
              raise SystemExit('observed consumer test insertion boundary changed')
          tests.write_text(text[:pos] + insertion + text[pos:])
          PY

          git add observed-ust-consumer.js tests/unit/observed-ust-consumer.test.js
          git diff --cached --check

      - name: Run Web verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          ./tools/sw-assets-check.sh
          npx playwright test tests/e2e/input-canonical-source-lifecycle.spec.js tests/e2e/observed-ust-runtime.spec.js

      - name: Publish verified Web repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tuner-v17-triadic-ust-payload.yml .github/workflows/tuner-v17-q4-repair.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(input): carry triadic UST in canonical payload'
          git push origin HEAD:agent/preserve-input-canonical-payload-lifetime
