name: Consume pad-core pc8 preview

on:
  push:
    branches:
      - codex/web-push3-webusb-display-preview

permissions:
  contents: write

jobs:
  consume-test-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[pc8-web-consume]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-push3-webusb-display-preview
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin audited pad-core and align Web consumer regressions
        run: |
          set -euo pipefail
          target=eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          git -C pad-core fetch origin "$target"
          git -C pad-core checkout --detach "$target"
          test "$(git -C pad-core rev-parse HEAD)" = "$target"

          python3 - <<'PY'
          from pathlib import Path

          # Web cache / script pins
          replacements = {
              'pad-core/data.js?v=6.7.52': 'pad-core/data.js?v=6.7.54',
              'pad-core/theory.js?v=6.7.52': 'pad-core/theory.js?v=6.7.54',
          }
          for path in ['index.html', 'sw.js']:
              p = Path(path)
              s = p.read_text()
              for old, new in replacements.items():
                  if old not in s and new not in s:
                      raise SystemExit(f'{old} missing in {path}')
                  s = s.replace(old, new)
              p.write_text(s)

          p = Path('sw.js')
          s = p.read_text()
          import re
          if 'pc8-2' not in s:
              s2, n = re.subn(r"(var CACHE_NAME = '[^']+)(?=')", r"\1-pc8-2", s, count=1)
              if n != 1:
                  raise SystemExit('CACHE_NAME anchor missing')
              s = s2
          p.write_text(s)

          # Consumer tests must mirror pad-core SSOT instead of preserving the
          # discarded AI-era addb13/hard-suppression assumptions.
          p = Path('tests/unit/detectChord.test.js')
          s = p.read_text()
          old = "      expect(detectChord([60, 64, 67, 68])[0].name).toBe('Caddb13');\n"
          new = "      expect(detectChord([60, 64, 67, 68])[0].name).toBe('C(b6)');\n"
          if old not in s and new not in s:
              raise SystemExit('Caddb13 Web fixture anchor missing')
          s = s.replace(old, new)

          old = "      expect(results.some(r => r.name === 'Bm7(b13)')).toBe(false);\n"
          new = "      const altered = results.find(r => r.name === 'Bm7(b13)');\n      expect(altered).toBeDefined();\n      expect(altered.score).toBeLessThan(results[0].score);\n"
          if old not in s and new not in s:
              raise SystemExit('Bm7(b13) hard suppression Web fixture anchor missing')
          s = s.replace(old, new)

          anchor = "    it('recognizes jazz half-diminished omit3 voicings', () => {\n"
          regression = "    it('prefers BbMaj7 / D over the D-minor b6 color', () => {\n      const results = detectChord([62, 65, 69, 70]);\n      expect(results.length).toBeGreaterThan(0);\n      expect(results[0].name).toBe('BbMaj7 / D');\n      const lower = results.find(r => r.name === 'Dm(b6)');\n      expect(lower).toBeDefined();\n      expect(lower.score).toBeLessThan(results[0].score);\n    });\n\n"
          if regression not in s:
              if anchor not in s:
                  raise SystemExit('inversion regression insertion anchor missing')
              s = s.replace(anchor, regression + anchor, 1)
          p.write_text(s)
          PY

          git diff --check
          git status --short

      - name: Verify pad-core exact inversion behavior
        run: |
          set -euo pipefail
          cd pad-core
          npm ci
          npx vitest run tests/pc8-harmonic-semantics.test.js
          npm test

      - name: Verify Web consumer suite
        run: |
          set -euo pipefail
          npm ci
          npx vitest run tests/unit/detectChord.test.js
          npm test
          ./tools/sw-assets-check.sh

      - name: Commit consumer pin
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add pad-core index.html sw.js tests/unit/detectChord.test.js
          git commit -m 'fix(theory): consume pc8 inversion semantics in Web [pc8-web-consume]'
          git push origin HEAD:codex/web-push3-webusb-display-preview

      - name: Deploy exact dev preview
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
