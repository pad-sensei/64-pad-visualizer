name: Apply and verify v1.8.1 ancestor-scope dev SW escape

on:
  push:
    branches:
      - codex/v181-altered-dominant-ust
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-altered-dominant-ust
          submodules: recursive
          fetch-depth: 100

      - name: Apply ancestor-scope controller repair
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = """window.__padIsDevServiceWorkerRegistration = function(reg) {
  try {
    var scopePath = new URL(reg.scope).pathname;
    var activePath = reg.active ? new URL(reg.active.scriptURL).pathname : '';
    return scopePath.indexOf('/apps/64-pad-dev/') !== -1 || activePath.indexOf('/apps/64-pad-dev/sw.js') !== -1;
  } catch (_) {
    return false;
  }
};"""
          new = """window.__padCanControlCurrentDevPath = function(reg) {
  try {
    var scopeUrl = new URL(reg.scope);
    if (scopeUrl.origin !== location.origin) return false;
    var scopePath = scopeUrl.pathname;
    var pagePath = location.pathname;
    if (!scopePath.endsWith('/')) scopePath += '/';
    return pagePath === scopePath.slice(0, -1) || pagePath.indexOf(scopePath) === 0;
  } catch (_) {
    return false;
  }
};"""
          if old not in s:
              raise SystemExit('old dev SW registration predicate missing')
          s = s.replace(old, new, 1)
          s = s.replace('regs.filter(window.__padIsDevServiceWorkerRegistration)', 'regs.filter(window.__padCanControlCurrentDevPath)')
          p.write_text(s)

          t = Path('tests/unit/v181-dev-sw-escape-contract.test.js')
          ts = t.read_text()
          ts = ts.replace("expect(indexHtml).toContain('window.__padIsDevServiceWorkerRegistration');\n    expect(indexHtml).toContain(\"scopePath.indexOf('/apps/64-pad-dev/')\");",
                          "expect(indexHtml).toContain('window.__padCanControlCurrentDevPath');\n    expect(indexHtml).toContain('scopeUrl.origin !== location.origin');\n    expect(indexHtml).toContain(\"pagePath.indexOf(scopePath) === 0\");\n    expect(indexHtml).not.toContain('window.__padIsDevServiceWorkerRegistration');")
          t.write_text(ts)

          t2 = Path('tests/unit/v180-web-contract.test.js')
          s2 = t2.read_text().replace("expect(html).toContain('window.__padIsDevServiceWorkerRegistration');",
                                      "expect(html).toContain('window.__padCanControlCurrentDevPath');\n    expect(html).toContain(\"pagePath.indexOf(scopePath) === 0\");")
          t2.write_text(s2)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Verify
        run: |
          set -euo pipefail
          npm test
          ./tools/sw-assets-check.sh
          npm audit --omit=dev
          git diff --check
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 >/tmp/64pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f stale-root-sw.js tests/e2e/.tmp-dev-root-sw.spec.js; rm -f 64-pad-dev' EXIT
          ln -s . 64-pad-dev
          cat > stale-root-sw.js <<'EOF'
          self.addEventListener('install', event => event.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', event => event.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', event => {
            const url = new URL(event.request.url);
            if (url.pathname.endsWith('/chord-resolution-ui.js')) {
              event.respondWith(new Response('window.__STALE_ALIAS_HELPER = true;', { headers: { 'Content-Type': 'application/javascript' } }));
            }
          });
          EOF
          cat > tests/e2e/.tmp-dev-root-sw.spec.js <<'EOF'
          import { test, expect } from '@playwright/test';

          test('dev escapes a stale ancestor-scope service worker before app assets', async ({ page }) => {
            await page.goto('http://127.0.0.1:8080/?silent=1');
            await page.evaluate(async () => {
              await navigator.serviceWorker.register('/stale-root-sw.js', { scope: '/' });
              await navigator.serviceWorker.ready;
            });
            await page.goto('http://127.0.0.1:8080/64-pad-dev/?silent=1&e2e=root-sw');
            await page.waitForFunction(() => !navigator.serviceWorker.controller && typeof window.padWebFormatChordDisplayName === 'function');
            const result = await page.evaluate(() => {
              AppState.mode = 'input';
              PlainState.activeNotes.clear();
              PlainState.subMode = 'idle';
              if (typeof clearInstrumentInput === 'function') clearInstrumentInput();
              if (typeof releaseAllMidiHeldSources === 'function') releaseAllMidiHeldSources(true);
              if (typeof window.applyVelocityCurve !== 'function') window.applyVelocityCurve = value => value;
              [63,67,70,72].forEach(note => onMidiNoteOn(note,100));
              const top = document.querySelector('#midi-detect .detect-top-group');
              return {
                controller: !!navigator.serviceWorker.controller,
                staleHelper: !!window.__STALE_ALIAS_HELPER,
                top: top ? top.textContent.replace(/\s+/g,' ').trim() : '',
                readable: padWebFormatChordDisplayName('Em7(b5)(11)(omit3)')
              };
            });
            expect(result.controller).toBe(false);
            expect(result.staleHelper).toBe(false);
            expect(result.top).toContain('Eb6');
            expect(result.top).toContain('Cm7 / Eb');
            expect(result.top).toContain('=');
            expect(result.readable).toBe('Em7(b5,11)omit3');
          });
          EOF
          npx playwright test tests/e2e/.tmp-dev-root-sw.spec.js tests/e2e/v181-alias-runtime.spec.js tests/e2e/v181-altered-dominant-ust.spec.js --reporter=line
          rm -f tests/e2e/.tmp-dev-root-sw.spec.js stale-root-sw.js 64-pad-dev
          git checkout -- test-results
          git diff --check

      - name: Commit verified product changes
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add index.html tests/unit/v181-dev-sw-escape-contract.test.js tests/unit/v180-web-contract.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(v1.8.1): escape ancestor-scope service workers on dev'
          git push origin HEAD:codex/v181-altered-dominant-ust
