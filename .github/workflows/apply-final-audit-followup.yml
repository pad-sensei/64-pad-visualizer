name: Apply final audit follow-up

on:
  push:
    branches:
      - codex/web-v180-push-cc-parity
    paths:
      - '.github/workflows/apply-final-audit-followup.yml'

permissions:
  contents: write

jobs:
  verify-deploy-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-cc-parity
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify staging boundary and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=12f309daab50a52f8697cacabe92c3973429a4a6
          test "$(git merge-base "$EXPECTED" HEAD)" = "$EXPECTED"
          ACTUAL=$(git diff --name-only "$EXPECTED" HEAD | sort)
          EXPECTED_FILES=$(printf '%s\n' '.github/scripts/apply-final-audit-followup.py' '.github/workflows/apply-final-audit-followup.yml' | sort)
          test "$ACTUAL" = "$EXPECTED_FILES"
          python3 .github/scripts/apply-final-audit-followup.py

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test "$(git -C audio-core rev-parse HEAD)" = "99a2538c0ec829aae6f82ac824a2692224dd76a8"
          (cd audio-core && node --check audio-voice.js && node tests/sustain-voice-smoke.cjs)
          npx vitest run \
            tests/unit/audio-core-sustain-integration.test.js \
            tests/unit/midi-runtime-bootstrap.test.js \
            tests/unit/push-midi-port-contract.test.js \
            tests/unit/push-midi-output-routing.test.js \
            tests/unit/push-web-cc-integration.test.js \
            tests/unit/push-web-control.test.js \
            tests/unit/v180-web-contract.test.js
          npm test
          ./tools/sw-assets-check.sh
          grep -F "window.APP_VERSION = '6.7.61';" index.html
          grep -F "audio-core/epiano-worklet-processor.js?v=6.7.61" sw.js
          grep -F "'audio-core/spring-reverb-processor.js'" sw.js
          ! grep -F "audio-core/spring-reverb-processor.js?v=" sw.js
          ! grep -F "initializePush3PedalMode" push-midi-port-contract.js midi.js
          ! grep -F "0x37, 0x26, 0x50" push-midi-port-contract.js midi.js
          git diff --check

      - name: Deploy exact tested candidate
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: >-
            -avz
            --exclude='.git'
            --exclude='.github'
            --exclude='CLAUDE.md'
            --exclude='deploy.sh'
            --exclude='config.sh'
            --exclude='*.bak'
            --exclude='tests'
            --exclude='node_modules'
            --exclude='package*.json'
            --exclude='vitest.config.*'
            --exclude='pad-core/tests'
            --exclude='pad-core/node_modules'
            --exclude='pad-core/package*.json'
            --exclude='pad-core/vitest.config.*'
            --exclude='pad-core/CLAUDE.md'
            --exclude='audio-core/tests'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}

      - name: Commit verified follow-up and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git rm .github/workflows/apply-final-audit-followup.yml .github/scripts/apply-final-audit-followup.py
          git add index.html sw.js tests/unit/audio-core-sustain-integration.test.js tests/unit/midi-runtime-bootstrap.test.js
          git commit -m 'fix(audio): align worklet cache identity [final-audit-followup]'
          git push origin HEAD:codex/web-v180-push-cc-parity
