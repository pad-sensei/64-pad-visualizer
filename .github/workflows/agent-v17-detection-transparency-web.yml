name: Agent v1.7 detection transparency web

on:
  push:
    branches:
      - agent/v17-detection-transparency-web
    paths:
      - .github/workflows/agent-v17-detection-transparency-web.yml
      - tests/unit/v17-detection-transparency-consumer.test.js
      - pad-core

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify pad-core pin
        run: test "$(git -C pad-core rev-parse HEAD)" = "a21b9221dded1841542e21ccffb4406fe9c34a13"
      - run: npm ci
      - name: Run full Web unit suite
        run: npm test
      - name: Remove validation-only workflow
        run: |
          rm -f .github/workflows/agent-v17-detection-transparency-web.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove web validation workflow"
          git push origin HEAD:agent/v17-detection-transparency-web

# Registration-trigger commit: validation only; this file self-deletes after PASS.
