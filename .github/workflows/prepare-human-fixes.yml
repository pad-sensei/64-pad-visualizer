name: Prepare bounded candidate tree
on:
  push:
    branches: [codex/web-v180-semitone-preparation]
    paths: [.github/workflows/prepare-human-fixes.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: prep
      - uses: actions/checkout@v4
        with:
          ref: 62bc8f2a92f041a43bb4a5334a2fb69f009ef4d6
          submodules: recursive
          persist-credentials: false
          path: candidate
      - name: Prepare and check source
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 ../prep/.github/prepare-human-fixes.py
          node --check push-web-control.js
          node --check render.js
          node --check push-display-webusb-app.js
          node tests/push-standalone-parity.cjs
          git diff --exit-code
      - name: Publish only preparation branch
        working-directory: prep
        run: |
          set -euo pipefail
          git fetch --update-shallow --no-tags ../candidate HEAD
          tree=$(git rev-parse FETCH_HEAD^{tree})
          prepared=$(printf '%s\n' 'prepare: bounded candidate tree, no PR branch update' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$GITHUB_SHA")
          git push origin "$prepared":refs/heads/codex/web-v180-semitone-preparation
          echo "PREPARED_TREE=$tree"
          echo "PREPARATION_COMMIT=$prepared"
          echo 'No PR ref change, audit, or deployment. Candidate exact-head checks run separately.' >> "$GITHUB_STEP_SUMMARY"
