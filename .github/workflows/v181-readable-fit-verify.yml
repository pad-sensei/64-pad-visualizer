name: Verify v1.8.1 readable Push fit

on:
  push:
    branches:
      - codex/v181-tied-alias-equivalence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 80
          persist-credentials: false
      - name: Exact identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C pad-core rev-parse HEAD)" = 4a9b714f728a6f79eb9ec37f18b87bdd49129b9a
          git diff --check 932655e53c52b68def97a501d5d86150eaa7b7d7...HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit, PWA and readable-fit contract
        run: |
          set -euo pipefail
          node --check chord-resolution-ui.js
          node --check push-display-webusb-app.js
          node --check push-display-text-fit.js
          npm test
          ./tools/sw-assets-check.sh
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { fitPushPixelText, pushPixelTextUnits } from './push-display-text-fit.js';
          const app = fs.readFileSync('push-display-webusb-app.js', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const fit = fs.readFileSync('push-display-text-fit.js', 'utf8');
          if (app.includes("drawPixelText(snap.chord, 32, 42, 4, '#ffdb5c', 20)")) throw new Error('hard 20-char cutoff remains');
          if (app.includes('detected.slice(0, 48)')) throw new Error('fallback snapshot still truncates');
          if (!app.includes("querySelector('.detect-top-group')")) throw new Error('fallback still promotes the full detection panel');
          if (!app.includes('headline.lines.forEach')) throw new Error('wrapped headline rendering missing');
          if (!app.includes("'=':[0x14,0x14,0x14,0x14,0x14]")) throw new Error('equals glyph missing');
          if (!app.includes("'·':[0x00,0x00,0x08,0x00,0x00]")) throw new Error('neutral glyph missing');
          if (!fit.includes('const scale = 1;') || fit.includes('Math.min(maxScale, idealScale)')) throw new Error('sub-pixel fallback remains');
          const long = 'Eb7(b9) = Edim7(7) / D# = Dbdim7(9) / D# = Bbdim7(11) / D#';
          const longLayout = fitPushPixelText(long, 4, 688);
          if (longLayout.text !== long || longLayout.scale !== 2 || longLayout.lines.length !== 1 || longLayout.width > 688) throw new Error('real long equation fit changed');
          const overflow = Array(40).fill('C13sus4').join(' = ');
          const overflowLayout = fitPushPixelText(overflow, 4, 688);
          if (overflowLayout.scale !== 1 || overflowLayout.lines.length < 2 || overflowLayout.lines.join('') !== overflow) throw new Error('readable overflow wrapping failed');
          if (overflowLayout.lines.some(line => pushPixelTextUnits(line) > 688)) throw new Error('wrapped line exceeds width');
          if (!app.includes('push-display-text-fit.js?v=20260914-readable-wrap')) throw new Error('app helper identity stale');
          if (!sw.includes('push-display-text-fit.js?v=20260914-readable-wrap')) throw new Error('SW helper identity stale');
          if (!index.includes('push-display-webusb-app.js?v=webusb-20260914-headline-fit')) throw new Error('index app identity changed unexpectedly');
          if (!sw.includes('push-display-webusb-app.js?v=webusb-20260914-headline-fit')) throw new Error('SW app identity mismatch');
          if (!sw.includes("64pad-v181-preview-20260914-alias-equivalence-6")) throw new Error('SW generation stale');
          NODE
          npm audit --omit=dev
      - name: Browser regression
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 >/tmp/64pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/e2e/v181-alias-runtime.spec.js
          git checkout -- test-results
      - name: Read-only tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
