name: Apply fast Push LED shutdown

on:
  push:
    branches:
      - codex/web-push3-webusb-display-preview

permissions:
  contents: write

jobs:
  implement-test-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[fast-led-clear]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-push3-webusb-display-preview
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prioritize visible pad clear before hard sweep
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('push-display-webusb-app.js')
          s = p.read_text()
          old = "import { hardClearPushMidiOutputs } from './push-surface-cleanup.js';"
          new = "import { fastClearPushPads, hardClearPushMidiOutputs } from './push-surface-cleanup.js';"
          if old not in s:
              raise SystemExit('cleanup import anchor missing')
          s = s.replace(old, new, 1)
          old_cleanup = """      try { window.padWebResetPushMidiRuntimeState?.(); } catch (_) {}\n      try { hardClearPushMidiOutputs(window.padWebGetPushMidiOutputs?.() || []); } catch (_) {}\n      try { void probe.stop(message); } catch (_) {}\n"""
          new_cleanup = """      const pushOutputs = window.padWebGetPushMidiOutputs?.() || [];\n      // Desktop clears the visible pad paint first, then performs the exhaustive\n      // sweep. Browser teardown is time-limited, so make those 64 zero-velocity\n      // Note Ons the first hardware operation while the MIDI ports are alive.\n      try { fastClearPushPads(pushOutputs); } catch (_) {}\n      try { window.padWebResetPushMidiRuntimeState?.(); } catch (_) {}\n      try { hardClearPushMidiOutputs(pushOutputs); } catch (_) {}\n      try { void probe.stop(message); } catch (_) {}\n"""
          if old_cleanup not in s:
              raise SystemExit('cleanup body anchor missing')
          p.write_text(s.replace(old_cleanup, new_cleanup, 1))
          PY
          git diff --check
          git diff -- push-display-webusb-app.js
      - name: Verify
        run: |
          npm ci
          node --check push-display-webusb-app.js
          node --check push-surface-cleanup.js
          npx vitest run tests/unit/push-surface-cleanup.test.js tests/unit/push-display-webusb.test.js
          npm test
          ./tools/sw-assets-check.sh
      - name: Commit product change
        run: |
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add push-display-webusb-app.js
          git commit -m 'fix(push): clear visible pads before Web teardown sweep [fast-led-clear]'
          git push origin HEAD:codex/web-push3-webusb-display-preview
      - name: Deploy dev preview
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
