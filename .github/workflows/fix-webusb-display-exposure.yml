name: Fix WebUSB display exposure

on:
  push:
    branches:
      - codex/web-v180-push-cc-parity

permissions:
  contents: write

jobs:
  verify-deploy-cleanup:
    if: github.event.head_commit.message == 'ci(dev): fix standard WebUSB display exposure'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-cc-parity
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify staging boundary and apply fix
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT=709ade485541e1b53dc7cbe8e573ce170224b011
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/fix-webusb-display-exposure.yml"
          python3 - <<'PY'
          from pathlib import Path

          app = Path('push-display-webusb-app.js')
          text = app.read_text()
          old = "const params = new URLSearchParams(window.location.search);\nconst enabled = params.has('webusb') && !window.IS_DESKTOP_MODE;"
          new = "// v1.8.0: Push display is a standard optional/manual WebUSB feature.\n// The user still explicitly presses Push Display; only Desktop mode hides this browser control.\nconst enabled = !window.IS_DESKTOP_MODE;"
          if old not in text:
              raise SystemExit('legacy webusb query gate not found exactly')
          app.write_text(text.replace(old, new, 1))

          index = Path('index.html')
          text = index.read_text()
          old = 'push-display-webusb-app.js?v=webusb-20260911-10'
          new = 'push-display-webusb-app.js?v=webusb-20260912-11'
          if text.count(old) != 1:
              raise SystemExit(f'expected one index app version, got {text.count(old)}')
          index.write_text(text.replace(old, new, 1))

          sw = Path('sw.js')
          text = sw.read_text()
          old_asset = "'push-display-webusb-app.js?v=webusb-20260911-10'"
          new_asset = "'push-display-webusb-app.js?v=webusb-20260912-11'"
          if text.count(old_asset) != 1:
              raise SystemExit(f'expected one SW app asset, got {text.count(old_asset)}')
          text = text.replace(old_asset, new_asset, 1)
          old_cache = "var CACHE_NAME = '64pad-v180-preview-20260912-audio-sustain-3';"
          new_cache = "var CACHE_NAME = '64pad-v180-preview-20260912-webusb-exposure-1';"
          if old_cache not in text:
              raise SystemExit('expected previous CACHE_NAME not found')
          sw.write_text(text.replace(old_cache, new_cache, 1))

          test = Path('tests/unit/push-display-exposure.test.js')
          test.write_text("""import { describe, it, expect } from 'vitest';\nimport fs from 'fs';\n\nconst app = fs.readFileSync('push-display-webusb-app.js', 'utf8');\nconst index = fs.readFileSync('index.html', 'utf8');\nconst sw = fs.readFileSync('sw.js', 'utf8');\n\ndescribe('v1.8.0 Push Display exposure contract', () => {\n  it('exposes manual WebUSB display without a hidden query gate on Web', () => {\n    expect(app).toContain('const enabled = !window.IS_DESKTOP_MODE;');\n    expect(app).not.toContain("params.has('webusb')");\n    expect(app).not.toContain('new URLSearchParams(window.location.search)');\n    expect(app).toContain("button.textContent = 'Push Display'");\n  });\n\n  it('cache-busts the exposed display controller consistently', () => {\n    expect(index).toContain('push-display-webusb-app.js?v=webusb-20260912-11');\n    expect(sw).toContain("'push-display-webusb-app.js?v=webusb-20260912-11'");\n    expect(sw).toContain("var CACHE_NAME = '64pad-v180-preview-20260912-webusb-exposure-1';");\n    expect(index).not.toContain('push-display-webusb-app.js?v=webusb-20260911-10');\n  });\n});\n""")
          PY

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check push-display-webusb-app.js
          node --check push-display-webusb.js
          npx vitest run \
            tests/unit/push-display-exposure.test.js \
            tests/unit/push-display-webusb.test.js \
            tests/unit/v180-web-contract.test.js \
            tests/unit/push-midi-output-routing.test.js \
            tests/unit/push-web-cc-integration.test.js \
            tests/unit/audio-core-sustain-integration.test.js
          npm test
          ./tools/sw-assets-check.sh
          ! grep -F "params.has('webusb')" push-display-webusb-app.js
          grep -F "const enabled = !window.IS_DESKTOP_MODE;" push-display-webusb-app.js
          grep -F "push-display-webusb-app.js?v=webusb-20260912-11" index.html sw.js
          ! grep -F "initializePush3PedalMode" push-midi-port-contract.js midi.js
          ! grep -F "0x37, 0x26, 0x50" push-midi-port-contract.js midi.js
          git diff --check

      - name: Deploy exact tested candidate
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md' --exclude='audio-core/tests'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}

      - name: Finalize product tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git rm .github/workflows/fix-webusb-display-exposure.yml
          git add push-display-webusb-app.js index.html sw.js tests/unit/push-display-exposure.test.js
          git commit -m 'fix(webusb): expose manual Push display in v1.8.0'
          git push origin HEAD:codex/web-v180-push-cc-parity
