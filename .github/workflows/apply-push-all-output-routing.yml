name: Apply standalone Push output routing

on:
  push:
    branches:
      - codex/web-push3-webusb-display-preview

permissions:
  contents: write

jobs:
  implement-test-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[all-push-ports]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-push3-webusb-display-preview
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Mirror 64PE Desktop and Keys Push output ownership
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('midi.js')
          s = p.read_text()

          anchor = "let midiOutputDAW = null;    // DAW port for SysEx (may be same as midiOutput)\n"
          addition = anchor + "let _pushLedOutputs = [];  // all Push LED outputs, mirroring Keys standalone fan-out\n"
          if '_pushLedOutputs = []' not in s:
              if anchor not in s:
                  raise SystemExit('midi output declaration anchor missing')
              s = s.replace(anchor, addition, 1)

          old_get = '''function padWebGetPushMidiOutputs() {
            var outputs = [];
            var add = function(output) {
              if (!output || outputs.indexOf(output) >= 0) return;
              outputs.push(output);
            };
            add(midiOutput);
            add(midiOutputDAW);
            if (midiAccess && midiAccess.outputs) {
              for (const output of midiAccess.outputs.values()) {
                if (/push/i.test(output.name || '')) add(output);
              }
            }
            return outputs;
          }
          '''
          new_get = '''function padWebIsPushMidiPortName(name) {
            var n = String(name || '').trim();
            var lower = n.toLowerCase();
            // Pad Sensei Keys standalone evidence: CoreMIDI may expose Push ports
            // only as Live/User/External Port without an Ableton/Push prefix.
            return /push/i.test(n)
              || /ableton/i.test(n)
              || lower === 'live port'
              || lower === 'user port'
              || lower === 'external port';
          }

          function padWebCollectPushMidiOutputs(access) {
            var outputs = [];
            if (!access || !access.outputs) return outputs;
            for (const output of access.outputs.values()) {
              if (padWebIsPushMidiPortName(output.name)) outputs.push(output);
            }
            return outputs;
          }

          function padWebUniquePushOutputs(outputs) {
            var unique = [];
            (outputs || []).forEach(function(output) {
              if (output && unique.indexOf(output) < 0) unique.push(output);
            });
            return unique;
          }

          function padWebSendPushLedMessage(message) {
            var outputs = _pushLedOutputs.length ? _pushLedOutputs : [midiOutput];
            padWebUniquePushOutputs(outputs).forEach(function(output) {
              try { output.send(message); } catch (_) {}
            });
          }

          function padWebHardClearPushOutputs(outputs) {
            // Exact Gate-0 sequence proven in 64PE Desktop: app-visible pads first,
            // then explicit NoteOff for every pad on every channel, then CC=0.
            padWebUniquePushOutputs(outputs).forEach(function(output) {
              try { output.clear?.(); } catch (_) {}
              for (var note = 36; note <= 99; note++) {
                try { output.send([0x90, note, 0]); } catch (_) {}
              }
              for (var channel = 0; channel < 16; channel++) {
                for (var serialNote = 36; serialNote <= 99; serialNote++) {
                  try { output.send([0x80 | channel, serialNote, 0]); } catch (_) {}
                }
              }
              for (var cc = 0; cc <= 127; cc++) {
                try { output.send([0xb0, cc, 0]); } catch (_) {}
              }
            });
          }

          function padWebGetPushMidiOutputs() {
            var outputs = [];
            var add = function(output) {
              if (!output || outputs.indexOf(output) >= 0) return;
              outputs.push(output);
            };
            add(midiOutput);
            add(midiOutputDAW);
            _pushLedOutputs.forEach(add);
            if (midiAccess && midiAccess.outputs) {
              for (const output of midiAccess.outputs.values()) {
                if (padWebIsPushMidiPortName(output.name)) add(output);
              }
            }
            return outputs;
          }
          '''
          if 'function padWebIsPushMidiPortName' not in s:
              if old_get not in s:
                  raise SystemExit('padWebGetPushMidiOutputs block missing')
              s = s.replace(old_get, new_get, 1)

          old = '        const isPush = /Push/i.test(input.name);\n'
          new = '        const isPush = padWebIsPushMidiPortName(input.name);\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('input Push detection anchor missing')

          old = '''      midiOutput = null;
                midiOutputDAW = null;
                _lpOutputActive = false;
          '''
          new = '''      midiOutput = null;
                midiOutputDAW = null;
                _pushLedOutputs = [];
                _lpOutputActive = false;
          '''
          if '_pushLedOutputs = [];' not in s[s.find('function connectInputs()'):]:
              if old not in s:
                  raise SystemExit('output reset anchor missing')
              s = s.replace(old, new, 1)

          old = "        var isPush = /push/i.test(connectedName) || /ableton/i.test(connectedName);\n"
          new = "        var isPush = padWebIsPushMidiPortName(connectedName);\n"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('connected Push detection anchor missing')

          old_block = '''          // Push 3: try both Live Port (LED control) and User Port
                    var pushLivePort = null;
                    var pushUserPort = null;
                    for (const output of access.outputs.values()) {
                      console.log('[64PE LED] Checking output:', output.name);
                      if (/push/i.test(output.name) || /ableton/i.test(output.name)) {
                        if (/live/i.test(output.name)) pushLivePort = output;
                        else if (/user/i.test(output.name)) pushUserPort = output;
                      }
                    }
                    // LED control via Live Port (proven in standalone), fallback to User Port
                    midiOutput = pushLivePort || pushUserPort;
                    if (midiOutput) {
                      _lpOutputActive = true;
                      _lpProgrammerMode = true;
                      console.log('[64PE LED] Push LED output:', midiOutput.name);
                    }
          '''
          new_block = '''          // Match the standalone products: enumerate every Push output, including
                    // CoreMIDI's prefix-less Live/User/External Port names. Keep Live Port
                    // as the primary compatibility handle, but fan LED writes to all of them.
                    var pushOutputs = padWebCollectPushMidiOutputs(access);
                    _pushLedOutputs = pushOutputs.slice();
                    var pushLivePort = pushOutputs.find(function(output) { return /live/i.test(output.name || ''); }) || null;
                    var pushUserPort = pushOutputs.find(function(output) { return /user/i.test(output.name || ''); }) || null;
                    midiOutput = pushLivePort || pushUserPort || pushOutputs[0] || null;
                    if (midiOutput) {
                      // 64PE Desktop explicitly clears a stale previous owner at acquisition.
                      // Do the same before painting the Web state so a crash/old tab cannot
                      // leave an apparently immortal pad colour behind.
                      padWebHardClearPushOutputs(_pushLedOutputs);
                      _lpOutputActive = true;
                      _lpProgrammerMode = true;
                      console.log('[64PE LED] Push primary output:', midiOutput.name,
                                  'fan-out:', _pushLedOutputs.map(function(output) { return output.name; }));
                    }
          '''
          if '_pushLedOutputs = pushOutputs.slice();' not in s:
              if old_block not in s:
                  raise SystemExit('Push output selection block missing')
              s = s.replace(old_block, new_block, 1)

          old = '''        if (note >= 0 && note <= 127) {
                    midiOutput.send([0x90, note, color]);
                  }
          '''
          new = '''        if (note >= 0 && note <= 127) {
                    if (_isPush) padWebSendPushLedMessage([0x90, note, color]);
                    else midiOutput.send([0x90, note, color]);
                  }
          '''
          if 'padWebSendPushLedMessage([0x90, note, color])' not in s:
              if old not in s:
                  raise SystemExit('LED paint send anchor missing')
              s = s.replace(old, new, 1)

          old = '''      if (note >= 0 && note <= 127) {
                midiOutput.send([0x90, note, 0]);
              }
          '''
          new = '''      if (note >= 0 && note <= 127) {
                if (_isPush) padWebSendPushLedMessage([0x90, note, 0]);
                else midiOutput.send([0x90, note, 0]);
              }
          '''
          if 'padWebSendPushLedMessage([0x90, note, 0])' not in s:
              if old not in s:
                  raise SystemExit('LED clear send anchor missing')
              s = s.replace(old, new, 1)

          p.write_text(s)

          # Make sure this exact hardware candidate reaches the browser, not the prior SW graph.
          token_old = 'webusb-20260911-6'
          token_new = 'webusb-20260911-7'
          for path in ['index.html', 'push-display-webusb-app.js', 'sw.js']:
              p = Path(path)
              text = p.read_text()
              if token_old not in text:
                  raise SystemExit(f'WebUSB cache token missing in {path}')
              p.write_text(text.replace(token_old, token_new))

          for path in ['index.html', 'sw.js']:
              p = Path(path)
              text = p.read_text()
              old = 'midi.js?v=6.7.52'
              new = 'midi.js?v=6.7.53'
              if old not in text and new not in text:
                  raise SystemExit(f'midi cache URL missing in {path}')
              p.write_text(text.replace(old, new))
          PY

          cat > tests/unit/push-midi-output-routing.test.js <<'JS'
          import { describe, it, expect } from 'vitest';
          import fs from 'node:fs';

          describe('Push Web MIDI output routing parity', () => {
            const source = fs.readFileSync(new URL('../../midi.js', import.meta.url), 'utf8');

            it('recognizes prefix-less CoreMIDI Push ports used by Keys standalone', () => {
              expect(source).toContain("lower === 'live port'");
              expect(source).toContain("lower === 'user port'");
              expect(source).toContain("lower === 'external port'");
              expect(source).toContain('padWebIsPushMidiPortName(input.name)');
            });

            it('fans Push LEDs to all matching outputs and selects Live as primary', () => {
              expect(source).toContain('_pushLedOutputs = pushOutputs.slice();');
              expect(source).toContain('pushLivePort || pushUserPort || pushOutputs[0] || null');
              expect(source).toContain('padWebSendPushLedMessage([0x90, note, color])');
              expect(source).toContain('_pushLedOutputs.forEach(add);');
            });

            it('clears stale firmware-owned state at output acquisition', () => {
              expect(source).toContain('padWebHardClearPushOutputs(_pushLedOutputs);');
              expect(source).toContain('output.send([0x80 | channel, serialNote, 0])');
              expect(source).toContain('output.send([0xb0, cc, 0])');
            });
          });
          JS

          git diff --check
          git diff -- midi.js index.html sw.js push-display-webusb-app.js tests/unit/push-midi-output-routing.test.js
      - name: Verify focused and full Web suite
        run: |
          npm ci
          node --check midi.js
          node --check push-display-webusb-app.js
          npx vitest run tests/unit/push-midi-output-routing.test.js tests/unit/push-led-shutdown-guard.test.js tests/unit/push-surface-cleanup.test.js tests/unit/push-display-webusb.test.js
          npm test
          ./tools/sw-assets-check.sh
      - name: Commit product change
        run: |
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git add midi.js index.html sw.js push-display-webusb-app.js tests/unit/push-midi-output-routing.test.js
          git commit -m 'fix(push): mirror standalone all-output LED routing [all-push-ports]'
          git push origin HEAD:codex/web-push3-webusb-display-preview
      - name: Deploy dev preview
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
