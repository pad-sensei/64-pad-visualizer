name: Apply Push Live-Port runtime correction

on:
  push:
    branches:
      - codex/web-v180-push-cc-parity

permissions:
  contents: write

concurrency:
  group: web-v180-push-liveport-runtime
  cancel-in-progress: false

jobs:
  apply-test-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[push3-liveport-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-cc-parity
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply product patch
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-push3-liveport-runtime.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('midi.js')
          s = p.read_text()
          old = "if (typeof window !== 'undefined' && !window.__64PE_PUSH_DIAG_ERROR_HOOK__) {"
          new = "if (typeof window !== 'undefined' && typeof window.addEventListener === 'function' && !window.__64PE_PUSH_DIAG_ERROR_HOOK__) {"
          if old not in s:
              raise SystemExit('Push diagnostic browser guard anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify
        run: |
          set -euo pipefail
          npm ci
          node --check push-midi-port-contract.js
          node --check push-midi-cc-map.js
          node --check push-web-control.js
          node --check midi.js
          npx vitest run \
            tests/unit/push-midi-port-contract.test.js \
            tests/unit/push-midi-output-routing.test.js \
            tests/unit/push-web-cc-integration.test.js \
            tests/unit/push-web-control.test.js \
            tests/unit/push-display-webusb.test.js \
            tests/unit/v180-web-contract.test.js
          npm test
          ./tools/sw-assets-check.sh
          git diff --check

      - name: Deploy exact tested candidate
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}

      - name: Commit tested product changes
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git rm .github/workflows/apply-push3-liveport-runtime.yml .github/scripts/apply-push3-liveport-runtime.py
          git add \
            push-midi-port-contract.js \
            midi.js \
            index.html \
            sw.js \
            tests/unit/push-midi-port-contract.test.js \
            tests/unit/push-midi-output-routing.test.js \
            tests/unit/push-web-cc-integration.test.js \
            tests/unit/v180-web-contract.test.js
          git commit -m 'fix(push): keep Web runtime on Live Port and initialize generic Push 3 [push3-liveport-applied]'
          git push origin HEAD:codex/web-v180-push-cc-parity
