name: Build Push display active-color candidate
on:
  push:
    branches:
      - tuner/push-display-active-color-20260913
permissions:
  contents: write
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tuner/push-display-active-color-20260913
          fetch-depth: 3
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Switch to exact A05 head and apply repair
        run: |
          set -euo pipefail
          git checkout --detach 0d98e353b984a0472bbe044af4e23d4bff096dca
          test "$(git rev-parse HEAD)" = 0d98e353b984a0472bbe044af4e23d4bff096dca
          test "$(git rev-parse HEAD^{tree})" = 81b38b505561fbe2b48f7a335fe2fe05d4001861
          git show tuner/push-display-active-color-20260913:.github/active-color.py > /tmp/active-color.py
          python /tmp/active-color.py
      - name: Verify bounded diff and tests
        run: |
          set -euo pipefail
          node --check push-web-control.js
          node --check push-display-webusb-app.js
          npx vitest run tests/unit/push-display-active-color.test.js tests/unit/push-web-control.test.js tests/unit/push-display-exposure.test.js tests/unit/push-web-cc-integration.test.js
          npm test
          ./tools/sw-assets-check.sh
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" -eq 7
          for f in push-web-control.js push-display-webusb-app.js index.html sw.js tests/unit/push-display-exposure.test.js tests/unit/push-web-cc-integration.test.js tests/unit/push-display-active-color.test.js; do git diff --name-only | grep -Fx "$f" >/dev/null; done
      - name: Commit and publish candidate
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add push-web-control.js push-display-webusb-app.js index.html sw.js tests/unit/push-display-exposure.test.js tests/unit/push-web-cc-integration.test.js tests/unit/push-display-active-color.test.js
          git commit -m 'fix(push): restore active control display colors'
          git branch -f tuner/push-display-active-color-candidate-20260913 HEAD
          git push origin tuner/push-display-active-color-candidate-20260913 --force-with-lease
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
