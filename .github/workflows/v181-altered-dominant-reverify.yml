name: Reverify v1.8.1 altered dominant accepted core pin

on:
  push:
    branches:
      - codex/v181-altered-dominant-ust
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v181-altered-dominant-ust
          submodules: recursive
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pin and unit/PWA verification
        run: |
          set -euo pipefail
          test "$(git -C pad-core rev-parse HEAD)" = "65bc1fdd69d9fa50b3150a562be5b907aa288d1a"
          npm test
          ./tools/sw-assets-check.sh
          npm audit --omit=dev
          git diff --check
      - name: Chromium regressions
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 >/tmp/64pe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          npx playwright test tests/e2e/v181-alias-runtime.spec.js tests/e2e/v181-altered-dominant-ust.spec.js
          git checkout -- test-results
          git diff --check
          test -z "$(git status --porcelain)"
