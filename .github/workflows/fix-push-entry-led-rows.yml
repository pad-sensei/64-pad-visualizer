name: Fix Push entry LED rows

on:
  push:
    branches:
      - codex/web-v180-push-cc-parity

permissions:
  contents: write

concurrency:
  group: web-v180-push-entry-led-rows
  cancel-in-progress: false

jobs:
  apply-test-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[entry-led-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-cc-parity
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply entry-row LED correction
        run: |
          set -euo pipefail
          python3 .github/scripts/fix-push-entry-led-rows.py
      - name: Verify
        run: |
          set -euo pipefail
          npm ci
          node --check push-web-control.js
          npx vitest run tests/unit/push-web-control.test.js tests/unit/push-midi-output-routing.test.js tests/unit/push-web-cc-integration.test.js
          npm test
          ./tools/sw-assets-check.sh
          git diff --check
      - name: Deploy exact tested candidate
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --exclude='.git' --exclude='.github' --exclude='CLAUDE.md' --exclude='deploy.sh' --exclude='config.sh' --exclude='*.bak' --exclude='tests' --exclude='node_modules' --exclude='package*.json' --exclude='vitest.config.*' --exclude='pad-core/tests' --exclude='pad-core/node_modules' --exclude='pad-core/package*.json' --exclude='pad-core/vitest.config.*' --exclude='pad-core/CLAUDE.md'
          path: ./
          remote_path: ~/murinaikurashi.com/public_html/apps/64-pad-dev/
          remote_host: xs071284.xsrv.jp
          remote_port: 10022
          remote_user: xs071284
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
      - name: Commit tested product change
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git rm .github/workflows/fix-push-entry-led-rows.yml .github/scripts/fix-push-entry-led-rows.py
          git add push-web-control.js tests/unit/push-web-control.test.js
          git commit -m 'fix(push): align lower-row LEDs with chord entry [entry-led-applied]'
          git push origin HEAD:codex/web-v180-push-cc-parity
