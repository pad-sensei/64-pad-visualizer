name: Apply bounded semitone delta parity correction
on:
  push:
    branches: [tuner/64pe-semitone-delta-f460-20260912]
    paths: [.github/workflows/apply-semitone-delta-f460.yml]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-v180-push-human-gate-followup
          fetch-depth: 0
          submodules: recursive
      - name: Assert frozen audited parent and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f4605772d88311df63164c7880e1ce87aa5e4d2b
          test "$(git rev-parse HEAD^{tree})" = 7bb832831f2a5285ca282a73d262275f63969974
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
          npm ci
      - name: Add signed-delta regressions and prove old source fails them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/push-web-control.test.js')
          s = p.read_text()
          marker = '\n});\n'
          assert s.endswith(marker)
          addition = r'''

  it('preserves signed relative magnitude for D-pad completed-chord semitone moves', () => {
    globalThis.AppState = { mode: 'chord' };
    globalThis.BuilderState = { root: 10, quality: { name: 'maj7', pcs: [0, 4, 7, 11] }, tension: '9', bass: 2 };

    expect(handleLogical(35, 3)).toBe(true);
    expect(globalThis.BuilderState.root).toBe(1);
    expect(globalThis.BuilderState.bass).toBe(5);

    expect(handleLogical(35, -4)).toBe(true);
    expect(globalThis.BuilderState.root).toBe(9);
    expect(globalThis.BuilderState.bass).toBe(1);
  });

  it('preserves signed relative magnitude on the chord-root encoder path', () => {
    globalThis.AppState = { mode: 'chord' };
    globalThis.BuilderState = { root: 1, quality: { name: 'm7', pcs: [0, 3, 7, 10] }, tension: null, bass: 8 };

    expect(handleLogical(56, 5)).toBe(true);
    expect(globalThis.BuilderState.root).toBe(6);
    expect(globalThis.BuilderState.bass).toBe(1);
  });
'''
          p.write_text(s[:-len(marker)] + addition + marker)
          PY
          set +e
          npx vitest run tests/unit/push-web-control.test.js > "$RUNNER_TEMP/negative-control.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/negative-control.log"
          test "$status" -ne 0
      - name: Apply minimal parity correction and cache identity update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('push-web-control.js')
          s = p.read_text()
          old = """  function nudgeChordRoot(delta) {\n    if (!runtime.BuilderState || runtime.BuilderState.root === null || runtime.BuilderState.root === undefined || !runtime.BuilderState.quality) return false;\n    var step = delta < 0 ? -1 : 1;\n    if (runtime.TastyState && runtime.TastyState.enabled) call('disableTasty');\n    if (runtime.StockState && runtime.StockState.enabled) call('disableStock');\n    runtime.BuilderState.root = wrap(runtime.BuilderState.root + step, 12);\n    if (runtime.BuilderState.bass !== null && runtime.BuilderState.bass !== undefined) {\n      runtime.BuilderState.bass = wrap(runtime.BuilderState.bass + step, 12);\n    }\n"""
          new = """  function nudgeChordRoot(delta) {\n    if (!runtime.BuilderState || runtime.BuilderState.root === null || runtime.BuilderState.root === undefined || !runtime.BuilderState.quality) return false;\n    if (runtime.TastyState && runtime.TastyState.enabled) call('disableTasty');\n    if (runtime.StockState && runtime.StockState.enabled) call('disableStock');\n    runtime.BuilderState.root = wrap(runtime.BuilderState.root + delta, 12);\n    if (runtime.BuilderState.bass !== null && runtime.BuilderState.bass !== undefined) {\n      runtime.BuilderState.bass = wrap(runtime.BuilderState.bass + delta, 12);\n    }\n"""
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          sw = Path('sw.js')
          ss = sw.read_text()
          assert ss.count('64pad-v180-preview-20260912-semitone-5') == 1
          sw.write_text(ss.replace('64pad-v180-preview-20260912-semitone-5', '64pad-v180-preview-20260912-semitone-delta-6'))

          exp = Path('tests/unit/push-display-exposure.test.js')
          es = exp.read_text()
          assert '64pad-v180-preview-20260912-semitone-5' in es
          exp.write_text(es.replace('64pad-v180-preview-20260912-semitone-5', '64pad-v180-preview-20260912-semitone-delta-6'))
          PY
          git diff --check
      - name: Focused and full machine gates
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run tests/unit/push-web-control.test.js tests/unit/push-display-exposure.test.js
          node tests/push-standalone-parity.cjs
          npm test
          ./tools/sw-assets-check.sh
          ! grep -R -n -E 'initializePush3PedalMode|0x37[^\n]*0x26[^\n]*0x50' -- midi.js push-web-control.js host-adapter.js
          git diff --check
      - name: Commit exact candidate and fast-forward product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '14957082+openai@users.noreply.github.com'
          git add push-web-control.js tests/unit/push-web-control.test.js sw.js tests/unit/push-display-exposure.test.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 4
          git commit -m 'fix(push): preserve signed semitone delta parity'
          candidate=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          echo "CANDIDATE_HEAD=$candidate"
          echo "CANDIDATE_TREE=$tree"
          git fetch origin codex/web-v180-push-human-gate-followup
          test "$(git rev-parse origin/codex/web-v180-push-human-gate-followup)" = f4605772d88311df63164c7880e1ce87aa5e4d2b
          git push origin HEAD:refs/heads/codex/web-v180-push-human-gate-followup
          test "$(git status --porcelain)" = ''
