name: Verify served and loaded 64PE dev 2fa84f39

on:
  push:
    branches: [tuner/64pe-dispatch-dev-2fa-20260912]
    paths: [.github/workflows/verify-served-dev-2fa.yml]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: 2fa84f39d92ed4f5070fe525411c21b2978d3326
    steps:
      - name: Checkout unchanged accepted source for byte comparisons
        uses: actions/checkout@v4
        with:
          ref: 2fa84f39d92ed4f5070fe525411c21b2978d3326
          path: candidate
          persist-credentials: false
      - name: Verify product identity and completed existing dev deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          gh api repos/pad-sensei/64-pad-visualizer/pulls/22 | jq -e --arg sha "$EXPECTED_HEAD" '.head.sha == $sha and .state == "open"' >/dev/null
          gh api repos/pad-sensei/64-pad-visualizer/actions/runs/34678099933 | jq -e --arg sha "$EXPECTED_HEAD" '.head_sha == $sha and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/deploy-dev.yml"' >/dev/null
          python3 -m venv "$RUNNER_TEMP/64pe-browser-check-venv"
          "$RUNNER_TEMP/64pe-browser-check-venv/bin/python" -m pip install --disable-pip-version-check 'playwright==1.55.0'
      - name: Compare served assets and actually executed module in hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/64pe-browser-check-venv/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          BASE = 'https://murinaikurashi.com/apps/64-pad-dev/'
          CACHE = '64pad-v180-preview-20260912-display-active-4'
          APP = 'push-display-webusb-app.js'
          APP_URL = APP + '?v=webusb-20260912-11'
          ROOT = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'candidate'
          expected = (ROOT / APP).read_bytes().decode('utf-8')
          sha = lambda data: hashlib.sha256(data).hexdigest()
          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          assert chrome, 'Existing runner Chrome missing; do not alter system browser policy'
          report = {'target': BASE, 'productHead': os.environ['EXPECTED_HEAD'], 'http': [], 'browser': []}
          # Accepted index.html intentionally unregisters SWs on /64-pad-dev/.
          # The earlier checker wrongly required an active SW. Do not change the product to satisfy it.
          index = (ROOT / 'index.html').read_text()
          assert "location.pathname.indexOf('/64-pad-dev/') !== -1" in index
          assert 'if (_is64PadDevDeploy)' in index and 'return r.unregister()' in index
          with sync_playwright() as p:
              request = p.request.new_context(timeout=30000)
              for relative, path in [('index.html', 'index.html'), ('sw.js', 'sw.js'), (APP_URL, APP)]:
                  result = request.get(BASE + relative)
                  assert result.status == 200, f'{relative}: HTTP {result.status}'
                  assert urlparse(result.url).path.startswith('/apps/64-pad-dev/'), 'Unexpected redirect'
                  actual = result.body()
                  assert actual == (ROOT / path).read_bytes(), f'{relative}: served bytes differ from accepted source'
                  report['http'].append({'asset': relative, 'sha256': sha(actual), 'byteMatch': True})
              assert CACHE in (ROOT / 'sw.js').read_text()
              print('SERVED_BYTES=' + json.dumps(report['http']), flush=True)
              browser = p.chromium.launch(executable_path=chrome, headless=True)
              context = browser.new_context(viewport={'width': 1440, 'height': 1000}, service_workers='allow')
              page = context.new_page()
              errors = []
              page.on('pageerror', lambda error: errors.append(str(error)[:300]))
              cdp = context.new_cdp_session(page)
              parsed = {}
              cdp.on('Debugger.scriptParsed', lambda e: parsed.update({e['scriptId']: e['url']}) if urlparse(e.get('url', '')).path == '/apps/64-pad-dev/' + APP else None)
              cdp.send('Debugger.enable')
              cdp.send('Profiler.enable')
              cdp.send('Profiler.startPreciseCoverage', {'callCount': True, 'detailed': True})
              for attempt in ['fresh-context', 'same-context-normal-reload']:
                  parsed.clear()
                  cdp.send('Profiler.takePreciseCoverage')
                  response = page.goto(BASE, wait_until='domcontentloaded', timeout=45000) if attempt == 'fresh-context' else page.reload(wait_until='domcontentloaded', timeout=45000)
                  assert response and response.status == 200, 'Page navigation was not HTTP 200'
                  page.locator('#push-webusb-display-btn').wait_for(state='attached', timeout=20000)
                  page.wait_for_function('''async () => window._is64PadDevDeploy === true &&
                    navigator.serviceWorker.controller === null &&
                    (await navigator.serviceWorker.getRegistrations()).length === 0''', timeout=10000)
                  assert parsed, 'Display module was not parsed by this browser'
                  for script_id in list(parsed):
                      loaded = cdp.send('Debugger.getScriptSource', {'scriptId': script_id})['scriptSource']
                      assert loaded == expected, 'Browser-parsed display module differs from accepted source'
                  coverage = cdp.send('Profiler.takePreciseCoverage')['result']
                  relevant = [item for item in coverage if item['scriptId'] in parsed]
                  executed = sum(1 for item in relevant for function in item['functions'] for region in function['ranges'] if region['count'] > 0)
                  assert executed > 0, 'Parsed module has no observed execution coverage'
                  state = page.evaluate('''async () => ({
                    url: location.href,
                    controller: navigator.serviceWorker.controller?.scriptURL || null,
                    registrations: (await navigator.serviceWorker.getRegistrations()).length,
                    caches: await caches.keys(),
                    buttonCount: document.querySelectorAll('#push-webusb-display-btn').length,
                    status: document.querySelector('#push-webusb-display-status')?.textContent,
                    desktop: !!window.IS_DESKTOP_MODE,
                    dev: window._is64PadDevDeploy
                  })''')
                  assert state['url'].startswith(BASE)
                  assert state['controller'] is None and state['registrations'] == 0 and state['dev'] is True
                  assert state['buttonCount'] == 1 and not state['desktop']
                  report['browser'].append({'visit': attempt, 'parsedSourceSha256': sha(expected.encode()), 'executedCoverageRanges': executed, **state})
                  print('BROWSER_VISIT=' + json.dumps(report['browser'][-1]), flush=True)
              report['pageErrors'] = errors
              report['servedSwGeneration'] = CACHE
              report['swRuntimePolicy'] = 'intentionally unregistered on dev; served sw.js is not an active dev cache generation'
              report['limitations'] = 'Isolated hosted Chrome only; no owner-tab inspection, no USB/MIDI permission, no Push connection, no sound/physical pixels, no old-profile upgrade proof.'
              print('DEV_SERVED_AND_LOADED_IDENTITY=PASS', flush=True)
              print('BROWSER_IDENTITY_REPORT=' + json.dumps(report), flush=True)
              browser.close()
              request.dispose()
          PY
          git -C candidate diff --exit-code
          git -C candidate diff --cached --exit-code
