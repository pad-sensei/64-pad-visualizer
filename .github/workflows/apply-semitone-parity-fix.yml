name: Apply bounded 64PE semitone parity fix

on:
  push:
    branches: [tuner/64pe-semitone-fix-20260912]
    paths: [.github/workflows/apply-semitone-parity-fix.yml]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: 64pe-semitone-fix-20260912
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: 2fa84f39d92ed4f5070fe525411c21b2978d3326
      TARGET_BRANCH: codex/web-v180-push-human-gate-followup
    steps:
      - name: Checkout unchanged product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
          persist-credentials: true

      - name: Assert exact starting identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = "ededffba9d2b84c4005aa72f0cfc7ebe10fb3867"

      - name: Install dependencies
        run: npm ci

      - name: Add regressions first and prove old source fails them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/push-web-control.test.js')
          s = p.read_text()
          old = "  'getBuilderPCS', 'cycleTasty', 'cycleStock',\n];"
          new = "  'getBuilderPCS', 'cycleTasty', 'cycleStock', 'selectRoot',\n  'disableTasty', 'disableStock', 'resetVoicingSelection',\n  'updateKeyButtons', 'updateRootButtons', 'renderParentScales',\n];"
          assert s.count(old) == 1
          s = s.replace(old, new)
          marker = "\n});\n"
          pos = s.rfind(marker)
          assert pos >= 0
          tests = r'''

  it('nudges a completed chord by semitone without resetting its chord state', () => {
    const quality = { name: 'm7', pcs: [0, 3, 7, 10] };
    globalThis.AppState = { mode: 'chord' };
    globalThis.BuilderState = {
      root: 11,
      quality,
      tension: '9',
      bass: 4,
      _fromDiatonic: true,
      _diatonicScaleIdx: 0,
      _fromSecDom: true,
      _secDomTargetIsMajor: true,
    };
    let selectRootCalls = 0;
    let resetCalls = 0;
    globalThis.selectRoot = (root) => {
      selectRootCalls += 1;
      globalThis.BuilderState.root = root;
      globalThis.BuilderState.quality = null;
      globalThis.BuilderState.tension = null;
      globalThis.BuilderState.bass = null;
    };
    globalThis.resetVoicingSelection = () => { resetCalls += 1; };

    expect(handleLogical(35, 1)).toBe(true);
    expect(globalThis.BuilderState.root).toBe(0);
    expect(globalThis.BuilderState.bass).toBe(5);
    expect(globalThis.BuilderState.quality).toBe(quality);
    expect(globalThis.BuilderState.tension).toBe('9');
    expect(globalThis.BuilderState._fromDiatonic).toBe(false);
    expect(globalThis.BuilderState._diatonicScaleIdx).toBeUndefined();
    expect(globalThis.BuilderState._fromSecDom).toBe(false);
    expect(globalThis.BuilderState._secDomTargetIsMajor).toBeUndefined();
    expect(selectRootCalls).toBe(0);
    expect(resetCalls).toBe(1);
  });

  it('matches Standalone by leaving active voicing engines before chord semitone nudge', () => {
    globalThis.AppState = { mode: 'chord' };
    globalThis.BuilderState = { root: 0, quality: { name: '7', pcs: [0, 4, 7, 10] }, tension: null, bass: null };
    globalThis.TastyState = { enabled: true };
    globalThis.StockState = { enabled: true };
    globalThis.disableTasty = () => { globalThis.TastyState.enabled = false; };
    globalThis.disableStock = () => { globalThis.StockState.enabled = false; };

    expect(handleLogical(35, -1)).toBe(true);
    expect(globalThis.BuilderState.root).toBe(11);
    expect(globalThis.TastyState.enabled).toBe(false);
    expect(globalThis.StockState.enabled).toBe(false);
  });
'''
          p.write_text(s[:pos] + tests + s[pos:])
          PY

          set +e
          npx vitest run tests/unit/push-web-control.test.js > "$RUNNER_TEMP/negative.log" 2>&1
          negative_status=$?
          set -e
          cat "$RUNNER_TEMP/negative.log"
          test "$negative_status" -ne 0
          grep -q "nudges a completed chord by semitone" "$RUNNER_TEMP/negative.log"
          grep -q "matches Standalone by leaving active voicing engines" "$RUNNER_TEMP/negative.log"
          echo "NEGATIVE_CONTROL=PASS (old source rejects new parity regressions)"

      - name: Apply exact bounded source and cache-identity correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('push-web-control.js')
          s = p.read_text()
          old = '''  function nudgeChordRoot(delta) {
    if (!runtime.BuilderState || runtime.BuilderState.root === null || runtime.BuilderState.root === undefined) return false;
    var next = wrap(runtime.BuilderState.root + (delta < 0 ? -1 : 1), 12);
    if (typeof global.selectRoot === 'function') {
      global.selectRoot(next);
    } else {
      runtime.BuilderState.root = next;
      if (runtime.BuilderState.bass !== null && runtime.BuilderState.bass !== undefined) {
        runtime.BuilderState.bass = wrap(runtime.BuilderState.bass + (delta < 0 ? -1 : 1), 12);
      }
    }
    refresh();
    return true;
  }
'''
          new = '''  function nudgeChordRoot(delta) {
    if (!runtime.BuilderState || runtime.BuilderState.root === null || runtime.BuilderState.root === undefined || !runtime.BuilderState.quality) return false;
    var step = delta < 0 ? -1 : 1;
    if (runtime.TastyState && runtime.TastyState.enabled) call('disableTasty');
    if (runtime.StockState && runtime.StockState.enabled) call('disableStock');
    runtime.BuilderState.root = wrap(runtime.BuilderState.root + step, 12);
    if (runtime.BuilderState.bass !== null && runtime.BuilderState.bass !== undefined) {
      runtime.BuilderState.bass = wrap(runtime.BuilderState.bass + step, 12);
    }
    // Match Standalone: semitone navigation keeps the completed chord intact.
    // Only provenance and voicing selection are invalidated; selectRoot() is an
    // entry action and would incorrectly clear quality/tension/bass.
    runtime.BuilderState._fromDiatonic = false;
    runtime.BuilderState._diatonicScaleIdx = undefined;
    runtime.BuilderState._fromSecDom = false;
    runtime.BuilderState._secDomTargetIsMajor = undefined;
    call('resetVoicingSelection');
    refresh();
    return true;
  }
'''
          assert s.count(old) == 1, 'unexpected nudgeChordRoot preimage'
          p.write_text(s.replace(old, new))

          p = Path('index.html')
          s = p.read_text()
          old = '<script src="push-web-control.js?v=1.8.0-parity2"></script>'
          new = '<script src="push-web-control.js?v=1.8.0-parity3"></script>'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('sw.js')
          s = p.read_text()
          assert s.count("var CACHE_NAME = '64pad-v180-preview-20260912-display-active-4';") == 1
          assert s.count("'push-web-control.js?v=1.8.0-parity2',") == 1
          s = s.replace("var CACHE_NAME = '64pad-v180-preview-20260912-display-active-4';",
                        "var CACHE_NAME = '64pad-v180-preview-20260912-semitone-5';")
          s = s.replace("'push-web-control.js?v=1.8.0-parity2',",
                        "'push-web-control.js?v=1.8.0-parity3',")
          p.write_text(s)

          p = Path('tests/unit/push-display-exposure.test.js')
          s = p.read_text()
          old = "    expect(sw).toContain(\"var CACHE_NAME = '64pad-v180-preview-20260912-display-active-4';\");\n    expect(sw).not.toContain(\"var CACHE_NAME = '64pad-v180-preview-20260912-display-state-3';\");"
          new = "    expect(sw).toContain(\"var CACHE_NAME = '64pad-v180-preview-20260912-semitone-5';\");\n    expect(sw).not.toContain(\"var CACHE_NAME = '64pad-v180-preview-20260912-display-active-4';\");"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY

          node --check push-web-control.js
          git diff --check
          test "$(git diff --name-only | sort | paste -sd, -)" = "index.html,push-web-control.js,sw.js,tests/unit/push-display-exposure.test.js,tests/unit/push-web-control.test.js"
          ! git diff -- midi.js audio-core/ host-adapter.js | grep -q .
          grep -q 'push-web-control.js?v=1.8.0-parity3' index.html
          grep -q "64pad-v180-preview-20260912-semitone-5" sw.js

      - name: Run focused and full Web verification
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run tests/unit/push-web-control.test.js tests/unit/push-midi-cc-map.test.js tests/unit/push-web-cc-integration.test.js tests/unit/push-display-exposure.test.js
          npm test
          node audio-core/tests/worklet-bootstrap-smoke.js
          git diff --check

      - name: Commit and fast-forward product branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "ChatGPT TUNER"
          git config user.email "noreply@openai.com"
          git add push-web-control.js index.html sw.js tests/unit/push-web-control.test.js tests/unit/push-display-exposure.test.js
          git commit -m "fix(push): preserve chord state on semitone nudge"
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "NEW_PRODUCT_HEAD=$new_head"
          test -z "$(git status --porcelain)"
