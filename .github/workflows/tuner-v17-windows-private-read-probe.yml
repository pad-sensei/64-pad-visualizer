name: TUNER probe private Desktop read from Windows

on:
  push:
    branches: [tuner/v17-windows-builder-bridge]
    paths: [.github/workflows/tuner-v17-windows-private-read-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      DESKTOP_TOKEN: ${{ secrets.DESKTOP_DISPATCH_TOKEN }}
    steps:
      - name: Confirm Windows hosted runner and private read access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_TOKEN)) { throw 'DESKTOP_DISPATCH_TOKEN missing' }
          Write-Host "runner_os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:DESKTOP_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repo = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/pad-sensei/64-pad-explorer-desktop'
          if ($repo.full_name -ne 'pad-sensei/64-pad-explorer-desktop') { throw 'Private repository read failed' }
          $commit = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/pad-sensei/64-pad-explorer-desktop/commits/b39ec92e52d8321f4c1b9baf156a38707763ffd2'
          if ($commit.sha -ne 'b39ec92e52d8321f4c1b9baf156a38707763ffd2') { throw 'Exact source commit unavailable' }
          Write-Host 'private_desktop_read=PASS'
