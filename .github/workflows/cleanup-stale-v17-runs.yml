name: Cleanup stale v1.7 verifier runs

on:
  push:
    branches:
      - tuner/cleanup-stale-v17-runs-20260815
    paths:
      - .github/workflows/cleanup-stale-v17-runs.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, macOS, ARM64, dojo-audio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel stale queued runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cancel_run() {
            local run_id="$1"
            local body="/tmp/cancel-${run_id}.json"
            local code
            code="$(curl -sS -o "$body" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel")"
            case "$code" in
              202|409) printf 'run %s cancel result: HTTP %s\n' "$run_id" "$code" ;;
              *) cat "$body" >&2; printf 'run %s cancel failed: HTTP %s\n' "$run_id" "$code" >&2; exit 1 ;;
            esac
          }
          cancel_run 31801038605
          cancel_run 31801038475

      - name: Remove one-shot cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/cleanup-stale-v17-runs.yml
          git add .github/workflows/cleanup-stale-v17-runs.yml
          git commit -m 'chore: remove one-shot v1.7 run cleanup'
          git push origin HEAD:tuner/cleanup-stale-v17-runs-20260815
