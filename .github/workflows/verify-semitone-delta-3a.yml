name: Verify exact signed-delta candidate 3a880c17
on:
  push:
    branches: [tuner/64pe-semitone-delta-f460-20260912]
    paths: [.github/workflows/verify-semitone-delta-3a.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a880c172214972b3143cfff5b59ddad94b33abc
          submodules: recursive
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact immutable identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3a880c172214972b3143cfff5b59ddad94b33abc
          test "$(git rev-parse HEAD^{tree})" = e8e8e19f45839387ec0b9fbef7f0741092a60ff4
          test "$(git -C pad-core rev-parse HEAD)" = eded0b6f1108a75f889b5e62ac8198e2b27de3d0
          test "$(git -C audio-core rev-parse HEAD)" = dd1ef52e7681eb459bb35c729226063c5638c506
          git diff --check HEAD^ HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exact-head regression gates
        shell: bash
        run: |
          set -euo pipefail
          for f in push-web-control midi builder instruments plain; do node --check "$f.js"; done
          node tests/push-standalone-parity.cjs
          node audio-core/tests/worklet-sustain-bootstrap-smoke.cjs
          npm test
          ./tools/sw-assets-check.sh
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const index = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const urls = [...new Set([...index.matchAll(/(?:src|href)=["']([^"']+\.(?:js|css)(?:\?[^"']*)?)["']/g)]
            .map(m => m[1]).filter(url => !/^(?:[a-z]+:)?\/\//i.test(url)))];
          const missing = urls.filter(url => !sw.includes("'" + url + "'") && !sw.includes('"' + url + '"'));
          assert.deepEqual(missing.filter(url => url !== 'error-logger.js'), []);
          const source = ['midi.js','push-web-control.js','push-midi-cc-map.js','push-midi-port-contract.js']
            .map(file => fs.readFileSync(file,'utf8')).join('\n');
          for (const forbidden of ['initializePush3PedalMode','0x37, 0x26, 0x50','0x37,0x26,0x50']) assert(!source.includes(forbidden));
          console.log(`PWA URLs=${urls.length}, known missing=${JSON.stringify(missing)}; Pedal/CV guard PASS`);
          NODE
      - name: Verify read-only completion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3a880c172214972b3143cfff5b59ddad94b33abc
          test "$(git rev-parse HEAD^{tree})" = e8e8e19f45839387ec0b9fbef7f0741092a60ff4
          git diff --exit-code
          git diff --cached --exit-code
