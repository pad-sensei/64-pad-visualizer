name: Verify v1.8.1 alias audit follow-up

on:
  push:
    branches:
      - codex/v181-tied-alias-equivalence

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real-detector alias regressions
        run: npx vitest run tests/unit/v181-chord-resolution-consumer.test.js
      - name: Full Web suite
        run: npm test
      - name: Clean tree
        run: |
          git diff --check 932655e53c52b68def97a501d5d86150eaa7b7d7 HEAD
          git diff --exit-code
          git diff --cached --exit-code
